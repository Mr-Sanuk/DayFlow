function openCommandPalette(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="cmdk-overlay" id="cmdk-overlay">
    <div class="cmdk-box">
      <input class="cmdk-input" id="cmdk-input" placeholder="Jump to a page, or type to add a task…" autofocus>
      <div class="cmdk-list" id="cmdk-list"></div>
    </div>
  </div>`;
  root.querySelector('#cmdk-overlay').addEventListener('click', e=>{ if(e.target.id==='cmdk-overlay') closeModal(); });
  const input = document.getElementById('cmdk-input');
  const renderList = ()=>{
    const q = input.value.trim().toLowerCase();
    const list = document.getElementById('cmdk-list');
    const routeMatches = ROUTES.filter(r=>!q || r.label.toLowerCase().includes(q));
    let html = routeMatches.map(r=>`<div class="cmdk-item" data-go="${r.id}"><span>${r.icon}</span><span>${r.label}</span><span class="cmdk-hint">Page</span></div>`).join('');
    if(q) html += `<div class="cmdk-item" data-quickadd="${escapeHtml(q)}"><span>➕</span><span>Add task "${escapeHtml(input.value.trim())}"</span><span class="cmdk-hint">Enter</span></div>`;
    list.innerHTML = html;
    list.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click', ()=>{ go(el.dataset.go); closeModal(); }));
    list.querySelectorAll('[data-quickadd]').forEach(el=>el.addEventListener('click', ()=>quickAddFromPalette(input.value.trim())));
  };
  input.addEventListener('input', renderList);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      const q = input.value.trim();
      const firstRoute = ROUTES.find(r=>q && r.label.toLowerCase().includes(q.toLowerCase()));
      if(firstRoute && q){ go(firstRoute.id); closeModal(); }
      else if(q){ quickAddFromPalette(q); }
    }
    if(e.key==='Escape') closeModal();
  });
  renderList();
  setTimeout(()=>input.focus(), 30);
}
function quickAddFromPalette(text){
  if(!text) return;
  state.tasks.push({id:uid(), title:text, priority:'medium', dueDate:todayStr(), done:false, category:'', emoji:'', dueTime:'', note:'', createdAt:Date.now()});
  save(); closeModal(); if(currentRoute==='tasks'||currentRoute==='home') renderView();
  toast('Task added');
}
document.addEventListener('keydown', e=>{
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const typing = tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT';
  if((e.key==='k' || e.key==='K') && (e.ctrlKey || e.metaKey)){ e.preventDefault(); openCommandPalette(); }
  else if(e.key==='/' && !typing){ e.preventDefault(); openCommandPalette(); }
});

/* =====================================================================================
   AI BUDDY — a floating companion that chats, answers site questions, recommends books,
   and can create tasks from the conversation. Uses the same Claude API pattern as the
   AI Planner. Context is a compact snapshot of current state sent with each message —
   there's no server-side memory, but the conversation itself is saved locally so Flow
   "remembers" past chats across sessions.
   ===================================================================================== */
let chatOpen = false;
const CHAT_QUICK = ['Plan my day','Tell me a joke','Recommend a book','How am I doing?','Motivate me'];
const LOCAL_JOKES = [
  "Why did the to-do list go to therapy? Too many unresolved issues.",
  "I told my calendar a joke. It said it was already booked.",
  "Why don't tasks ever get lonely? They always come in lists.",
  "Procrastination is just future-you's problem. Sorry, future-you.",
  "Why did the Pomodoro timer get promoted? It really knew how to manage its time.",
];
const LOCAL_MOTIVATION = [
  "Small steps still move you forward. Pick the tiniest task and just start.",
  "You don't have to feel ready — momentum shows up after you begin.",
  "Done is better than perfect. One checkbox at a time. You've got this.",
  "Rest is part of the plan too. Take a breath, then take one small step.",
];
function timeGreeting(){
  const h = new Date().getHours();
  if(h<5) return 'Hey night owl';
  if(h<12) return 'Good morning';
  if(h<17) return 'Good afternoon';
  if(h<22) return 'Good evening';
  return 'Goodnight';
}
function greetName(){ return state.profile.name ? ', '+state.profile.name : ''; }
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function localBuddyReply(text){
  const t = (text||'').toLowerCase();
  const today = todayStr();
  const todays = state.tasks.filter(x=>x.dueDate===today);
  const left = todays.filter(x=>!x.done);
  const info = levelInfo(state.xp);
  if(/joke|funny|laugh/.test(t)) return pickRandom(LOCAL_JOKES);
  if(/motivat|inspire|encourag|sad|down|tired|unmotivated|stress/.test(t)) return pickRandom(LOCAL_MOTIVATION);
  if(/how am i doing|progress|stats|status|how.?s it going/.test(t))
    return `You're Level ${info.cur.lvl} (${info.cur.name}) with a ${state.streak}-day streak, ${state.coins} coins, and ${todays.length-left.length} of ${todays.length} tasks done today.`;
  if(/plan|schedule|what should i|to.?do|tasks/.test(t)){
    if(!todays.length) return "Nothing's planned yet. Try the AI Planner tab — paste a few notes and I'll turn them into tasks.";
    const order = {high:0, medium:1, low:2};
    const top = [...left].sort((a,b)=>(order[a.priority]??3)-(order[b.priority]??3)).slice(0,3).map(x=>x.title);
    return left.length ? `Start with: ${top.join(', ')}. ${left.length} left today — one at a time.` : 'Everything for today is done. Enjoy the rest of your day!';
  }
  if(/book|read/.test(t)){
    const favs = (state.profile.favGenres||[]);
    return favs.length ? `You like ${favs.join(', ')} — head to Desk → Books and filter by one of those genres.` : 'Tell me your mood (cozy, thrilling, sad, motivated?) and browse Desk → Books for a matching genre.';
  }
  if(/break|rest|sleep/.test(t)) return 'Take 5: stand up, drink some water, look out the window, then come back fresh.';
  if(/^(hi|hello|hey|yo)\b/.test(t)) return `${timeGreeting()}${greetName()}! How can I help?`;
  return null;
}

function dailyReviewPrompt(){
  const today = todayStr();
  const todays = state.tasks.filter(t=>t.dueDate===today);
  const unfinished = todays.filter(t=>!t.done);
  const done = todays.filter(t=>t.done);
  let msg;
  if(todays.length===0) msg = "No tasks were scheduled for today — hope it was a good one either way! 🌙";
  else if(unfinished.length===0) msg = `You finished all ${done.length} of today's tasks. That's a perfect day! 🎉`;
  else msg = `You finished ${done.length}/${todays.length} tasks today. I've moved the other ${unfinished.length} to tomorrow so you can pick them up fresh. 🌙`;
  unfinished.forEach(t=>{ t.dueDate = todayStr(new Date(Date.now()+86400000)); });
  if(unfinished.length) save();
  return msg;
}

function pushChatMessage(role, text){

async function sendChatMessage(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if(!text) return;
  input.value='';
  playSound('click');
  pushChatMessage('user', text);
  renderChatAppend('user', text);
  const thinkingEl = renderChatAppend('buddy', '…');
  try{
    const recent = state.chat.history.slice(-10).map(m=>({role: m.role==='user'?'user':'assistant', content:m.text}));
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:600, system: buddySystemPrompt(), messages: recent})
    });
    const data = await res.json();
    let reply = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    reply = handleBuddyBlocks(reply);
    thinkingEl.textContent = reply || "I'm here!";
    pushChatMessage('buddy', reply || "I'm here!");
    speakText(reply || "I'm here!");
    playSound('pop');
    checkBadges(); save();
  }catch(e){
    const local = localBuddyReply(text) || "I couldn't reach my online brain just now, but I can still do jokes, motivation, your progress, and today's plan — try the quick buttons!";
    thinkingEl.textContent = local;
    pushChatMessage('buddy', local);
    speakText(local);
    playSound('pop');
    checkBadges(); save();
  }
}
function renderChatAppend(role, text){
  const body = document.getElementById('chat-body');
  if(!body) return {textContent:''};
  const div = document.createElement('div');
  div.className = 'chat-msg '+(role==='user'?'user':'buddy');
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}
function handleBuddyBlocks(reply){
  const taskMatch = reply.match(/```dayflow-tasks\s*([\s\S]*?)```/);
  if(taskMatch){
    try{
      const arr = JSON.parse(taskMatch[1].trim());
      let count=0;
      arr.forEach(t=>{
        if(!t.title) return;
        state.tasks.push({id:uid(), title:t.title, priority:t.priority||'medium', dueTime:t.dueTime||'', dueDate:todayStr(), note:t.note||'', category:'', emoji:'', done:false, createdAt:Date.now()});
        count++;
      });
      if(count>0){ save(); toast(`Flow added ${count} task${count===1?'':'s'} ✨`); if(currentRoute==='tasks'||currentRoute==='home') renderView(); }
    }catch(e){ /* ignore malformed block */ }
    reply = reply.replace(taskMatch[0], '').trim();
  }
  const genreMatch = reply.match(/```dayflow-genre\s*([\s\S]*?)```/);
  if(genreMatch){
    const genre = genreMatch[1].trim();
    const picks = BOOK_LIBRARY.filter(b=>b.genre.toLowerCase()===genre.toLowerCase() && !state.books.owned.includes(b.id)).slice(0,3);
    if(picks.length){
      reply += `\n\nHere's what I found in ${genre}: ` + picks.map(p=>`"${p.title}" (🪙${p.price})`).join(', ') + '. Check the Desk → Books tab to grab one!';
    }
    reply = reply.replace(genreMatch[0], '').trim();
  }
  return reply;
}

   TASK REMINDERS — checks every 30s for tasks due now or in ~5 minutes
   ===================================================================================== */
function checkReminders(){
  const today = todayStr();
  const now = new Date();
  state.tasks.filter(t=>!t.done && t.dueDate===today && t.dueTime).forEach(t=>{
    const [h,m] = t.dueTime.split(':').map(Number);
    const due = new Date(); due.setHours(h,m,0,0);
    const diffMin = (due-now)/60000;
    const key5 = t.id+'_5min', keyNow = t.id+'_now';
    if(diffMin<=5.5 && diffMin>=4.5 && !state.settings.notifiedKeys[key5]){
      state.settings.notifiedKeys[key5]=true; notifyUser(`⏰ In 5 minutes: ${t.title}`);
    }
    if(diffMin<=0.25 && diffMin>=-0.5 && !state.settings.notifiedKeys[keyNow]){
      state.settings.notifiedKeys[keyNow]=true; notifyUser(`🔔 Time for: ${t.title}`);
    }
  });
  checkDailyReview();
  checkMorningGreeting();
  checkAfternoonGreeting();
  checkEveningGreeting();
  checkGoodnight();
  save();
}
function notifyUser(msg){
  pushChatMessage('buddy', msg);

  playSound('notify');
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('DayFlow', {body: msg}); }catch(e){}
  }
  toast(msg);
}

      save(); renderView();
    }));
    document.querySelectorAll('[data-action="delete-habit"]').forEach(b=>b.addEventListener('click', ()=>{
      state.habits = state.habits.filter(h=>h.id!==b.dataset.id); save(); renderView();
    }));
  }
  if(route==='notes'){
    document.getElementById('note-add').addEventListener('click', ()=>{
      state.notes.push({id:uid(), text:'', pinned:false, color:STICKY_COLORS[state.notes.length%STICKY_COLORS.length], createdAt:Date.now()});
      save(); renderView();
    });
    document.querySelectorAll('[data-action="pin-note"]').forEach(b=>b.addEventListener('click', ()=>{
      const n = state.notes.find(x=>x.id===b.dataset.id); n.pinned=!n.pinned; save(); renderView();
    }));
    document.querySelectorAll('[data-action="delete-note"]').forEach(b=>b.addEventListener('click', ()=>{
      state.notes = state.notes.filter(n=>n.id!==b.dataset.id); save(); renderView();
    }));
    document.querySelectorAll('[data-action="edit-note"]').forEach(ta=>ta.addEventListener('input', ()=>{
      const n = state.notes.find(x=>x.id===ta.dataset.id); n.text = ta.value; save();
    }));
  }
  if(route==='dashboard'){
    const rb = document.getElementById('btn-open-recap');
    if(rb) rb.addEventListener('click', openRecap);
  }
  if(route==='desk'){
    initDeskScene();
    refreshShopPanel();
    document.querySelectorAll('[data-shop-tab]').forEach(b=>b.addEventListener('click', ()=>{
      shopTab = b.dataset.shopTab;
      document.querySelectorAll('[data-shop-tab]').forEach(x=>x.classList.toggle('active', x===b));
      refreshShopPanel();
    }));
    const trashBtn = document.getElementById('desk-trash-btn');
    if(trashBtn) trashBtn.addEventListener('click', removeDeskSelected);
    refreshDeskGamesSlot();
  }
  if(route==='bank'){
    const amt = document.getElementById('bank-amount');
    const preview = document.getElementById('bank-preview');
    const updatePreview = ()=>{
      const v = Math.max(0, Math.min(state.xpBalance||0, +amt.value||0));
      preview.textContent = `${v} XP → 🪙 ${Math.floor(v/state.settings.coinRate)} coins`;
    };
    amt.addEventListener('input', updatePreview); updatePreview();
    document.querySelectorAll('[data-bank-pct]').forEach(b=>b.addEventListener('click', ()=>{
      amt.value = Math.floor((state.xpBalance||0) * (+b.dataset.bankPct/100));
      updatePreview();
    }));
    document.getElementById('bank-convert').addEventListener('click', ()=>{
      const v = Math.max(0, Math.min(state.xpBalance||0, +amt.value||0));
      const coins = Math.floor(v/state.settings.coinRate);
      if(coins<=0){ toast('Not enough XP for even 1 coin'); return; }
      const spent = coins*state.settings.coinRate;
      state.xpBalance -= spent; state.coins += coins;
      logCoinTx('convert', coins, `Converted ${spent} XP`);
      checkBadges(); save(); renderView();
      playSound('coin'); toast(`Converted ${spent} XP into 🪙 ${coins} coins`);
    });
  }
  if(route==='profile'){
    document.querySelectorAll('[data-avatar]').forEach(b=>b.addEventListener('click', ()=>{
      state.profile.avatarEmoji = b.dataset.avatar; state.profile.avatarPhoto=''; save(); renderView();
    }));
    document.getElementById('avatar-upload').addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = ()=>{
        img.onload = ()=>{
          const c = document.createElement('canvas'); c.width=96; c.height=96;
          const ctx = c.getContext('2d');
          const s = Math.min(img.width,img.height);
          ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, 96, 96);
          state.profile.avatarPhoto = c.toDataURL('image/jpeg', 0.85);
          save(); renderView();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    const clearBtn = document.getElementById('avatar-clear');
    if(clearBtn) clearBtn.addEventListener('click', ()=>{ state.profile.avatarPhoto=''; save(); renderView(); });
    document.getElementById('prof-name').addEventListener('change', e=>{ state.profile.name=e.target.value.trim(); save(); });
    document.getElementById('prof-age').addEventListener('change', e=>{ state.profile.age=e.target.value; save(); });
    document.getElementById('prof-gender').addEventListener('change', e=>{ state.profile.gender=e.target.value; save(); });
    const refreshProfileHeader = ()=>{
      const pp = state.profile;
      const n = document.getElementById('ph-name'); if(n) n.textContent = pp.name || 'Your name';
      const b = document.getElementById('ph-bio'); if(b) b.textContent = pp.bio || '';
      const m = document.getElementById('ph-meta'); if(m) m.textContent = profileMetaLine(pp);
    };
    const bindProfileText = (id, key, after)=>{
      const el = document.getElementById(id); if(!el) return;
      el.addEventListener('input', ()=>{ state.profile[key] = el.value; if(after) after(); });
      el.addEventListener('change', ()=>{ state.profile[key] = el.value.trim(); save(); });
    };
    bindProfileText('prof-name','name',refreshProfileHeader);
    bindProfileText('prof-bio','bio',refreshProfileHeader);
    bindProfileText('prof-country','country',refreshProfileHeader);
    bindProfileText('prof-school','school',refreshProfileHeader);
    bindProfileText('prof-tz','timezone',refreshProfileHeader);
    bindProfileText('prof-subjects','favSubjects');
    bindProfileText('prof-games','favGames');
    bindProfileText('prof-music','favMusic');
    document.querySelectorAll('[data-fav-genre]').forEach(b=>b.addEventListener('click', ()=>{
      const g = b.dataset.favGenre; const arr = state.profile.favGenres = state.profile.favGenres || [];
      const i = arr.indexOf(g); if(i>=0) arr.splice(i,1); else arr.push(g);
      save(); playSound('pop'); b.classList.toggle('active', i<0);
    }));
    document.querySelectorAll('[data-banner]').forEach(b=>b.addEventListener('click', ()=>{
      state.profile.banner = b.dataset.banner; save(); playSound('pop'); renderView();
    }));
    document.querySelectorAll('[data-showcase]').forEach(b=>b.addEventListener('click', ()=>{
      const id = b.dataset.showcase; const arr = state.profile.showcase = state.profile.showcase || [];
      const i = arr.indexOf(id);
      if(i>=0) arr.splice(i,1);
      else { if(arr.length>=3){ toast('Pick up to 3 badges'); playSound('error'); return; } arr.push(id); }
      save(); playSound('pop'); renderView();
    }));
    document.getElementById('goal-add').addEventListener('click', ()=>{
      const inp = document.getElementById('goal-input');
      if(inp.value.trim()){ state.profile.goals.push({id:uid(), text:inp.value.trim(), done:false}); save(); renderView(); }
    });
    document.querySelectorAll('[data-goal-toggle]').forEach(b=>b.addEventListener('click', ()=>{
      const g = state.profile.goals.find(x=>x.id===b.dataset.goalToggle); g.done=!g.done;
      if(g.done){ addXP(15); checkBadges(); }
      save(); renderView();
    }));
    document.querySelectorAll('[data-goal-delete]').forEach(b=>b.addEventListener('click', ()=>{
      state.profile.goals = state.profile.goals.filter(g=>g.id!==b.dataset.goalDelete); save(); renderView();
    }));
  }
  if(route==='stats'){ drawWeekChart(); drawCatChart(); }
  if(route==='settings'){
    document.getElementById('toggle-mode').addEventListener('click', ()=>{
      state.settings.mode = state.settings.mode==='dark'?'light':'dark'; applyTheme(); save(); renderView();
    });
    document.getElementById('toggle-sound').addEventListener('click', ()=>{
      state.settings.sound = !state.settings.sound; save(); renderView();
    });
    document.getElementById('vol-range').addEventListener('input', e=>{ state.settings.volume = (+e.target.value)/100; save(); });
    document.getElementById('vol-range').addEventListener('change', ()=>{ playSound('pop'); });
    document.getElementById('toggle-voice').addEventListener('click', ()=>{
      state.settings.voiceOutput = !state.settings.voiceOutput; save(); renderView();
    });
    document.getElementById('btn-notify').addEventListener('click', ()=>{
      if('Notification' in window) Notification.requestPermission().then(p=>toast(p==='granted'?'Notifications enabled':'Notifications blocked'));
    });
    document.querySelectorAll('[data-theme-pick]').forEach(c=>c.addEventListener('click', ()=>{
      const id = c.dataset.themePick;
      const t = THEMES.find(x=>x.id===id);
      const owned = (state.ownedThemes||[]).includes(id);
      if(owned){ state.settings.theme = id; applyTheme(); save(); renderView(); return; }
      if(state.coins < t.price){ playSound('error'); toast(`Not enough coins — need 🪙 ${t.price}`); return; }
      state.coins -= t.price; logCoinTx('spend', -t.price, t.name+' theme'); state.ownedThemes.push(id); state.settings.theme = id;
      applyTheme(); checkBadges(); save(); renderView(); playSound('coin'); toast(`Unlocked ${t.name} theme 🎉`);
    }));
    document.getElementById('coin-rate').addEventListener('change', e=>{ state.settings.coinRate = Math.max(1,+e.target.value||10); save(); });
    document.getElementById('pom-study').addEventListener('change', e=>{ state.settings.pomodoro.study = +e.target.value||25; save(); });
    document.getElementById('pom-break').addEventListener('change', e=>{ state.settings.pomodoro.break = +e.target.value||5; save(); });
  }
}

/* Global search */
document.getElementById('global-search').addEventListener('input', e=>{
  searchQuery = e.target.value.trim().toLowerCase();
  if(['tasks','notes'].includes(currentRoute)) renderView();
});

/* Voice input (best-effort; not all browsers support it) */
function setupVoice(){
  const btn = document.getElementById('btn-voice');
  if(!btn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ btn.title='Voice input not supported in this browser'; return; }
  btn.addEventListener('click', ()=>{
    const rec = new SR(); rec.lang='en-US'; rec.interimResults=false;
    toast('Listening…');
    rec.onresult = (e)=>{
      const transcript = e.results[0][0].transcript;
      const parsed = localParse(transcript)[0] || {title:transcript};
      state.tasks.push({id:uid(), title:parsed.title, dueTime:parsed.dueTime||'', priority:'medium', dueDate:todayStr(), category:'', emoji:'', note:parsed.note||'', done:false, createdAt:Date.now()});
      save(); renderView(); toast('Task added from voice 🎤');
    };
    rec.onerror = ()=>toast('Could not hear that — try again');
    rec.start();
  });
}

/* =====================================================================================
   THEME / MODE APPLICATION
   ===================================================================================== */
function applyTheme(){
  document.body.setAttribute('data-mode', state.settings.mode);
  document.body.setAttribute('data-theme', state.settings.theme);
  document.getElementById('btn-mode').textContent = state.settings.mode==='dark' ? '🌙' : '☀️';
  document.getElementById('btn-sound').textContent = state.settings.sound ? '🔊' : '🔇';
}

/* =====================================================================================
   INIT
   ===================================================================================== */
document.getElementById('btn-mode').addEventListener('click', ()=>{
  state.settings.mode = state.settings.mode==='dark'?'light':'dark'; applyTheme(); save();
});
document.getElementById('btn-sound').addEventListener('click', ()=>{
  state.settings.sound = !state.settings.sound; applyTheme(); save();
  if(state.settings.sound) playSound('pop');
});
document.getElementById('btn-focus').addEventListener('click', openFocus);
document.getElementById('btn-recap').addEventListener('click', openRecap);
document.getElementById('btn-cmdk').addEventListener('click', openCommandPalette);
document.getElementById('btn-profile').addEventListener('click', ()=>go('profile'));
document.getElementById('buddy-fab').addEventListener('click', toggleChat);

function checkDailyLogin(){
  const today = todayStr();
  if(state.lastLoginDate === today) return;
  const y = todayStr(new Date(Date.now()-86400000));
  state.loginStreak = (state.lastLoginDate === y) ? (state.loginStreak||0)+1 : 1;
  state.lastLoginDate = today;
  const reward = 10 + Math.min(state.loginStreak-1, 9)*5;
  state.coins += reward;
  logCoinTx('login', reward, `Day ${state.loginStreak} login bonus`);
  const interest = Math.min(100, Math.floor((state.coins||0)*0.02));
  if(interest>0){ state.coins += interest; logCoinTx('interest', interest, 'Savings interest'); }
  save();
  updateSidebarXP();
  const milestone = state.loginStreak===7 ? '🎁 7-day streak chest! ' : state.loginStreak===30 ? '👑 30-day streak chest! ' : '';
  setTimeout(()=>{
    openModal(`
    <div class="levelup-card">
      <div class="levelup-emoji">🪙</div>
      <h2 class="display" style="margin-bottom:6px;">${milestone}Day ${state.loginStreak} bonus!</h2>
      <p style="color:var(--text-dim); margin-bottom:18px;">You earned 🪙 ${reward} coins for coming back today${interest>0?` plus 🪙 ${interest} savings interest`:''}. Keep your login streak alive for bigger rewards.</p>
      <button class="btn" onclick="closeModal()">Nice</button>
    </div>`);
    playSound('celebrate');
  }, 600);
}
function init(){
  applyTheme();
  rolloverRecurringTasks();
  checkQuests();
  renderNav();
  renderView();
  tickClock();
  setupVoice();
  checkDailyLogin();
  setInterval(save, 1000);
  setInterval(checkReminders, 30000);
  setTimeout(checkReminders, 2500);
  setInterval(()=>{ if(currentRoute==='home') loadWeather(); }, 5*60*1000);
}
init();
</script>
