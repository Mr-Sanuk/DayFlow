<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DayFlow — Plan your day, level up your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ---------------------------------- RESET & THEME TOKENS ---------------------------------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0e1e; --bg2:#161832; --bg3:#1d1f42;
  --surface:rgba(255,255,255,0.055); --surface-strong:rgba(255,255,255,0.10);
  --border:rgba(255,255,255,0.11); --border-strong:rgba(255,255,255,0.2);
  --text:#EDEBFA; --text-dim:#A6A3C8; --text-faint:#6E6B94;
  --a1:#8B6CFF; --a2:#4EA8FF; --a3:#FF9F5A;
  --success:#39D98A; --danger:#FF5D77; --warn:#FFC857;
  --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
  --shadow-glow: 0 8px 32px -8px rgba(139,108,255,0.35);
  --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif;
}
[data-mode="light"]{
  --bg:#F5F4FC; --bg2:#EEECFA; --bg3:#E7E4F8;
  --surface:rgba(255,255,255,0.7); --surface-strong:rgba(255,255,255,0.95);
  --border:rgba(30,25,60,0.09); --border-strong:rgba(30,25,60,0.16);
  --text:#1C1A33; --text-dim:#5B5779; --text-faint:#918dab;
  --shadow-glow: 0 8px 28px -10px rgba(139,108,255,0.25);
}
[data-theme="ocean"]{ --a1:#00C2D1; --a2:#3E8BFF; --a3:#7CF5D0; }
[data-theme="sunset"]{ --a1:#FF6FA5; --a2:#FF9F5A; --a3:#C86BFF; }
[data-theme="neon"]{ --a1:#39FF9E; --a2:#FF3ECB; --a3:#4EF0FF; }
[data-theme="forest"]{ --a1:#4CAF6D; --a2:#8CC63F; --a3:#C9A86A; }
[data-theme="pixel"]{ --a1:#5EB34A; --a2:#8B6A4F; --a3:#7FA6D6; }
[data-theme="anime"]{ --a1:#FF6FCB; --a2:#7C6CFF; --a3:#FFD26F; }
[data-theme="midnight"]{ --a1:#2E4A7A; --a2:#6C63FF; --a3:#C9A86A; }
[data-theme="arcade"]{ --a1:#FF3EC8; --a2:#3EF0FF; --a3:#FFE94E; }
[data-theme="cyberpunk"]{ --a1:#FF2E63; --a2:#08D9D6; --a3:#FFD400; }
[data-theme="halloween"]{ --a1:#FF7A1A; --a2:#7C2AE8; --a3:#2E2A3A; }
[data-theme="winter"]{ --a1:#8FD3F4; --a2:#B5E5FF; --a3:#EAF6FF; }
[data-theme="blossom"]{ --a1:#FFB6D9; --a2:#FF8FC0; --a3:#C9A86A; }
[data-theme="cafe"]{ --a1:#B5651D; --a2:#E0A96D; --a3:#6B4226; }
[data-theme="autumn"]{ --a1:#D9782D; --a2:#B5651D; --a3:#E8B84B; }
[data-theme="spring"]{ --a1:#7FD858; --a2:#FFB6D9; --a3:#FFE94E; }
[data-theme="rainybedroom"]{ --a1:#5C7A99; --a2:#3E5C76; --a3:#9BC1D9; }

html,body{height:100%;}
body{
  font-family:var(--font-body); color:var(--text); background:var(--bg);
  min-height:100vh; overflow-x:hidden;
  transition:background .4s ease, color .4s ease;
}
h1,h2,h3,.display{font-family:var(--font-display);}
button,input,textarea,select{font-family:inherit; color:inherit;}
button{cursor:pointer;}
a{color:inherit;text-decoration:none;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
:focus-visible{outline:2px solid var(--a2); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ---------------------------------- BACKGROUND ---------------------------------- */
.bg-blobs{position:fixed; inset:0; z-index:-1; overflow:hidden; background:
  radial-gradient(ellipse at 20% 0%, var(--bg3), var(--bg) 60%);}
.blob{position:absolute; border-radius:50%; filter:blur(70px); opacity:.35; animation:drift 22s ease-in-out infinite;}
.blob.b1{width:420px;height:420px; background:var(--a1); top:-10%; left:-8%;}
.blob.b2{width:380px;height:380px; background:var(--a2); bottom:-12%; right:-6%; animation-duration:26s; animation-delay:-6s;}
.blob.b3{width:300px;height:300px; background:var(--a3); top:40%; left:60%; animation-duration:30s; animation-delay:-12s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,-30px) scale(1.12);}}

/* ---------------------------------- LAYOUT ---------------------------------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; flex-shrink:0; padding:22px 14px; display:flex; flex-direction:column; gap:4px;
  border-right:1px solid var(--border); position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg,var(--a1),var(--a2)); display:flex;align-items:center;justify-content:center;font-size:18px; box-shadow:var(--shadow-glow);}
.brand-name{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:var(--radius-sm);
  color:var(--text-dim); font-weight:500; font-size:14.5px; border:none; background:transparent; width:100%; text-align:left;
  transition:background .18s ease, color .18s ease, transform .12s ease;
}
.nav-item .ic{font-size:17px; width:20px; text-align:center;}
.nav-item:hover{background:var(--surface); color:var(--text);}
.nav-item.active{background:var(--surface-strong); color:var(--text); box-shadow:inset 0 0 0 1px var(--border-strong);}
.nav-item.active .ic{transform:scale(1.05);}
.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px;}
.buddy-card{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border);}
.buddy-emoji{font-size:26px; width:38px; height:38px; border-radius:11px; background:var(--surface-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; animation:buddyfloat 3s ease-in-out infinite;}
@keyframes buddyfloat{0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);}}
.buddy-name{font-size:12.5px; font-weight:700;}
.buddy-line{font-size:11px; color:var(--text-dim); line-height:1.3;}
.xp-mini{padding:12px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border);}
.xp-mini-top{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
.xp-bar{height:7px; border-radius:6px; background:var(--border); overflow:hidden;}
.xp-bar-fill{height:100%; background:linear-gradient(90deg,var(--a1),var(--a2)); border-radius:6px; transition:width .5s ease;}

.main{flex:1; min-width:0; padding:26px 34px 60px; max-width:1180px;}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.searchbox{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
  border-radius:999px; padding:9px 16px; min-width:240px; flex:1; max-width:380px;
}
.searchbox input{background:transparent; border:none; outline:none; width:100%; font-size:13.5px; color:var(--text);}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:16px; transition:transform .15s ease, background .15s ease;
}
.icon-btn:hover{transform:translateY(-2px); background:var(--surface-strong);}

.page{animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
h1.page-title{font-size:26px; font-weight:700; margin-bottom:4px;}
p.page-sub{color:var(--text-dim); font-size:14px; margin-bottom:22px;}

/* ---------------------------------- CARDS / GLASS ---------------------------------- */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:20px; backdrop-filter: blur(18px);
}
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

/* ---------------------------------- HOME HERO ---------------------------------- */
.hero{
  border-radius:28px; padding:34px 36px; position:relative; overflow:hidden; margin-bottom:22px;
  background:linear-gradient(135deg, color-mix(in srgb, var(--a1) 18%, var(--bg2)), color-mix(in srgb, var(--a2) 14%, var(--bg2)));
  border:1px solid var(--border);
}.hero-greeting{font-size:14.5px; color:var(--text-dim); margin-bottom:6px;}
.hero-clock{font-family:var(--font-display); font-size:52px; font-weight:700; letter-spacing:.5px; line-height:1;}
.hero-date{margin-top:8px; font-size:15px; color:var(--text-dim);}
.hero-row{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap;}
.streak-chip{display:flex; align-items:center; gap:8px; background:var(--surface-strong); border:1px solid var(--border); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px;}
.countdown-chip{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); padding:8px 14px; border-radius:999px; font-weight:600; font-size:12.5px; color:var(--text-dim);}
.weather-anim{position:absolute; inset:0; overflow:hidden; border-radius:inherit; pointer-events:none;}
.weather-anim span{position:absolute; top:-12px;}
.weather-anim.rain span{width:2px; height:14px; background:linear-gradient(var(--a2),transparent); animation:rainfall 0.7s linear infinite; opacity:0.6;}
.weather-anim.snow span{width:5px; height:5px; border-radius:50%; background:#fff; animation:snowfall 4.5s linear infinite; opacity:0.8;}
@keyframes rainfall{from{transform:translateY(-14px);} to{transform:translateY(130px);}}
@keyframes snowfall{from{transform:translateY(-14px) translateX(0);} to{transform:translateY(130px) translateX(12px);}}
.garden-plant{font-size:44px; text-align:center; transition:transform .3s ease;}
.garden-bar{height:8px; border-radius:6px; background:var(--border); overflow:hidden; margin-top:10px;}
.garden-bar-fill{height:100%; background:linear-gradient(90deg,var(--success),#2bb673); border-radius:6px; transition:width .5s ease;}

/* ---------------------------------- TASKS ---------------------------------- */
.task-add{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
.task-add input[type=text]{flex:1; min-width:180px;}
.field{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:10px 13px; font-size:14px; outline:none; color:var(--text);
}
.field:focus{border-color:var(--a2);}
.btn{
  border:none; border-radius:12px; padding:10px 18px; font-weight:600; font-size:14px;
  background:linear-gradient(120deg,var(--a1),var(--a2)); color:#fff; transition:transform .15s ease, box-shadow .15s ease;
}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-glow);}
.btn.ghost{background:var(--surface); color:var(--text); border:1px solid var(--border);}
.btn.small{padding:7px 12px; font-size:12.5px; border-radius:9px;}
.btn.danger-o{background:transparent; border:1px solid var(--danger); color:var(--danger);}

.task-list{display:flex; flex-direction:column; gap:10px;}
.task{
  display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:var(--radius-md);
  background:var(--surface); border:1px solid var(--border); transition:transform .15s ease, opacity .3s ease;
}
.task[draggable=true]{cursor:grab;}
.task.dragging{opacity:.4;}
.task.done{opacity:.55;}
.task.done .task-title{text-decoration:line-through; color:var(--text-faint);}
.check{
  width:24px;height:24px;border-radius:50%; border:2px solid var(--border-strong); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:13px; transition:all .2s ease;
}
.check.on{background:linear-gradient(120deg,var(--success),#2bb673); border-color:transparent; animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(.6);} 60%{transform:scale(1.25);} 100%{transform:scale(1);}}
.task-body{flex:1; min-width:0;}
.task-title{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.task-meta{display:flex; gap:8px; margin-top:4px; flex-wrap:wrap; font-size:11.5px; color:var(--text-dim);}
.pill{padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid var(--border);}
.pri-high{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent);}
.pri-medium{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 40%, transparent);}
.pri-low{color:var(--success); border-color:color-mix(in srgb, var(--success) 40%, transparent);}
.cat-pill{color:var(--text-dim);}
.task-actions{display:flex; gap:6px; opacity:0; transition:opacity .15s ease;}
.task:hover .task-actions{opacity:1;}
.mini-btn{width:28px;height:28px;border-radius:8px; background:transparent; border:1px solid var(--border); font-size:13px;}
.mini-btn:hover{background:var(--surface-strong);}
.empty{color:var(--text-faint); font-size:13.5px; padding:26px 4px; text-align:center;}

/* ---------------------------------- MODAL ---------------------------------- */
.modal-overlay{position:fixed; inset:0; background:rgba(5,5,15,0.55); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:60; animation:fadein .2s ease;}
.modal{width:min(460px,92vw); background:var(--bg2); border:1px solid var(--border-strong); border-radius:var(--radius-lg); padding:22px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5);}
.modal h3{margin-bottom:14px;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.form-grid .full{grid-column:1/-1;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
label.small-label{font-size:11.5px; color:var(--text-dim); margin-bottom:4px; display:block;}

/* ---------------------------------- DASHBOARD ---------------------------------- */
.ring-wrap{display:flex; flex-direction:column; align-items:center; gap:8px;}
.ring-label{font-size:12.5px; color:var(--text-dim); text-align:center;}
.ring-value{font-family:var(--font-display); font-size:20px; font-weight:700;}
.stat-num{font-family:var(--font-display); font-size:28px; font-weight:700;}
.stat-label{color:var(--text-dim); font-size:12.5px; margin-top:2px;}
.badge-grid{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px;}
.badge{display:flex; flex-direction:column; align-items:center; gap:6px; width:82px; text-align:center;}
.badge-ic{width:52px;height:52px;border-radius:16px; display:flex;align-items:center;justify-content:center; font-size:24px; background:var(--surface); border:1px solid var(--border);}
.badge.locked .badge-ic{opacity:.28; filter:grayscale(1);}
.badge.locked span{color:var(--text-faint);}
.badge span{font-size:10.5px; color:var(--text-dim);}
.badge.tier-bronze .badge-ic{box-shadow:inset 0 0 0 2px #B5651D33;}
.badge.tier-silver .badge-ic{box-shadow:inset 0 0 0 2px #C9CEDB55;}
.badge.tier-gold .badge-ic{box-shadow:inset 0 0 0 2px #FFC85788;}
.badge.tier-diamond .badge-ic{box-shadow:inset 0 0 0 2px #7CF5D0aa; background:linear-gradient(135deg, rgba(124,245,208,.12), rgba(139,108,255,.12));}
.tier-header{display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--text-dim); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.4px;}
.tier-header:first-child{margin-top:0;}
.tier-count{font-weight:500; color:var(--text-faint); text-transform:none; letter-spacing:0;}

/* ---------------------------------- CALENDAR ---------------------------------- */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-dow{text-align:center; font-size:11px; color:var(--text-faint); padding-bottom:4px;}
.cal-day{
  aspect-ratio:1/0.85; border-radius:12px; background:var(--surface); border:1px solid var(--border);
  padding:6px; font-size:12px; display:flex; flex-direction:column; gap:4px; cursor:pointer; transition:background .15s ease;
}
.cal-day:hover{background:var(--surface-strong);}
.cal-day.other{opacity:.3;}
.cal-day.today{border-color:var(--a2); box-shadow:0 0 0 1px var(--a2);}
.cal-day.selected{background:var(--surface-strong); box-shadow:inset 0 0 0 1px var(--a1);}
.cal-dots{display:flex; gap:3px; margin-top:auto; flex-wrap:wrap;}
.dot{width:6px;height:6px;border-radius:50%;}

/* ---------------------------------- HABITS / NOTES / MOOD ---------------------------------- */
.habit-row{display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--radius-md); background:var(--surface); border:1px solid var(--border); margin-bottom:10px;}
.habit-check{width:34px;height:34px;border-radius:10px; border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.habit-check.on{background:linear-gradient(120deg,var(--a1),var(--a2)); border-color:transparent;}
.notes-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px;}
.sticky{border-radius:16px; padding:14px; min-height:130px; display:flex; flex-direction:column; gap:8px; position:relative; box-shadow:0 8px 20px -10px rgba(0,0,0,.3);}
.sticky textarea{background:transparent; border:none; outline:none; resize:none; flex:1; font-size:13.5px; color:inherit; font-family:inherit;}
.sticky-top{display:flex; justify-content:space-between; align-items:center;}
.mood-row{display:flex; gap:10px; flex-wrap:wrap;}
.mood-opt{font-size:26px; padding:8px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--border); transition:transform .15s ease;}
.mood-opt.sel{background:var(--surface-strong); box-shadow:inset 0 0 0 2px var(--a1); transform:scale(1.08);}

/* ---------------------------------- FOCUS / POMODORO ---------------------------------- */
.focus-overlay{position:fixed; inset:0; z-index:70; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; background:radial-gradient(ellipse at 50% 20%, var(--bg3), var(--bg) 70%);}
.timer-ring{position:relative; width:260px; height:260px;}
.timer-time{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:48px; font-weight:700;}
.mode-tabs{display:flex; gap:8px; background:var(--surface); padding:5px; border-radius:999px; border:1px solid var(--border);}
.mode-tab{padding:8px 16px; border-radius:999px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--text-dim);}
.mode-tab.active{background:linear-gradient(120deg,var(--a1),var(--a2)); color:#fff;}
.focus-tasks{width:min(420px,90vw); max-height:160px; overflow:auto;}

/* ---------------------------------- MISC ---------------------------------- */
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--border); font-size:12.5px; font-weight:600; color:var(--text-dim);}
.chip.active{background:var(--surface-strong); color:var(--text); box-shadow:inset 0 0 0 1px var(--border-strong);}
.theme-swatch{width:100%; height:74px; border-radius:14px; margin-bottom:8px; border:1px solid var(--border);}
.theme-card{padding:12px; border-radius:16px; background:var(--surface); border:1px solid var(--border); text-align:center; cursor:pointer;}
.theme-card.active{box-shadow:inset 0 0 0 2px var(--a1);}
.toggle{width:44px;height:25px;border-radius:99px; background:var(--border-strong); position:relative; border:none; flex-shrink:0;}
.toggle::after{content:''; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:#fff; transition:transform .2s ease;}
.toggle.on{background:linear-gradient(120deg,var(--a1),var(--a2));}
.toggle.on::after{transform:translateX(19px);}
.settings-row{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.ai-preview{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
.ai-preview-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; font-size:13.5px;}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--bg2); border:1px solid var(--border-strong); padding:13px 22px; border-radius:14px; font-size:14px; font-weight:600; z-index:90; box-shadow:0 12px 30px -10px rgba(0,0,0,.5); animation:toastin .25s ease;}
@keyframes toastin{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
.levelup-card{text-align:center; padding:36px 30px;}
.levelup-emoji{font-size:56px; margin-bottom:10px;}
canvas#confetti-canvas{position:fixed; inset:0; z-index:99; pointer-events:none;}

/* Quests */
.quest-row{display:flex; align-items:center; gap:12px; padding:11px 4px;}
.quest-ic{font-size:20px; width:36px;height:36px;border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.quest-body{flex:1; min-width:0;}
.quest-top{display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:5px;}
.quest-xp{font-size:11px; color:var(--a2); font-weight:700;}
.quest-bar{height:6px; border-radius:6px; background:var(--border); overflow:hidden;}
.quest-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--a1),var(--a3)); transition:width .5s ease;}

/* Command palette */
.cmdk-overlay{position:fixed; inset:0; z-index:80; background:rgba(5,5,15,0.55); backdrop-filter:blur(4px); display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;}
.cmdk-box{width:min(520px,90vw); background:var(--bg2); border:1px solid var(--border-strong); border-radius:18px; overflow:hidden; box-shadow:0 30px 60px -20px rgba(0,0,0,.55);}
.cmdk-input{width:100%; padding:16px 18px; background:transparent; border:none; outline:none; font-size:16px; color:var(--text); border-bottom:1px solid var(--border);}
.cmdk-list{max-height:320px; overflow:auto; padding:8px;}
.cmdk-item{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px; font-size:13.5px; cursor:pointer;}
.cmdk-item:hover, .cmdk-item.sel{background:var(--surface-strong);}
.cmdk-hint{font-size:10.5px; color:var(--text-faint); margin-left:auto;}

/* Weekly Recap */
.recap-card{padding:30px 28px; text-align:center; border-radius:26px; background:linear-gradient(155deg, color-mix(in srgb, var(--a1) 30%, var(--bg2)), color-mix(in srgb, var(--a3) 22%, var(--bg2)));}
.recap-title{font-size:13px; color:var(--text-dim); letter-spacing:.3px; margin-bottom:2px;}
.recap-big{font-family:var(--font-display); font-size:44px; font-weight:700; margin-bottom:2px;}
.recap-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; text-align:left;}
.recap-stat{background:rgba(255,255,255,0.08); border-radius:14px; padding:14px;}
.recap-stat .n{font-family:var(--font-display); font-size:22px; font-weight:700;}
.recap-stat .l{font-size:11px; color:var(--text-dim); margin-top:2px;}

/* Desk / Marketplace */
.desk-canvas-wrap{width:100%; height:400px; border-radius:18px; overflow:hidden; background:radial-gradient(ellipse at 50% 20%, var(--bg3), var(--bg) 80%); position:relative; touch-action:none;}
.desk-canvas-wrap canvas{display:block; width:100%; height:100%;}
.desk-hint{position:absolute; bottom:10px; left:14px; font-size:11px; color:var(--text-faint); background:rgba(0,0,0,0.25); padding:4px 9px; border-radius:8px;}
.selected-bar{display:flex; align-items:center; justify-content:space-between; margin-top:10px; padding:10px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-size:13px;}
.shop-tabs{display:flex; gap:8px; margin:16px 0 12px; flex-wrap:wrap;}
.shop-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
.shop-item{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; text-align:center;}
.shop-item .ic{font-size:30px; margin-bottom:6px;}
.shop-item .nm{font-size:12.5px; font-weight:600; margin-bottom:2px;}
.shop-item .pr{font-size:11.5px; color:var(--a3); font-weight:700; margin-bottom:8px;}
.shop-item.owned{box-shadow:inset 0 0 0 1px var(--success);}

/* Books */
.book-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:6px;}
.book-title{font-size:12.5px; font-weight:700; line-height:1.3;}
.book-meta{font-size:10.5px; color:var(--text-dim);}
.stars{color:var(--warn); font-size:11px;}

/* Bank */
.bank-hero{display:flex; gap:20px; flex-wrap:wrap;}
.bank-box{flex:1; min-width:160px; text-align:center; padding:22px; border-radius:18px; background:var(--surface); border:1px solid var(--border);}
.bank-box .n{font-family:var(--font-display); font-size:30px; font-weight:700;}
.bank-box .l{font-size:12px; color:var(--text-dim); margin-top:2px;}

/* Profile */
.avatar-picker{display:flex; flex-wrap:wrap; gap:8px;}
.avatar-opt{font-size:22px; width:44px;height:44px; border-radius:12px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;}
.avatar-opt.sel{box-shadow:inset 0 0 0 2px var(--a1);}
.goal-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border);}
.goal-row:last-child{border-bottom:none;}

/* AI Buddy chat */
.buddy-fab{position:fixed; right:26px; bottom:26px; width:58px;height:58px;border-radius:50%; background:linear-gradient(135deg,var(--a1),var(--a2)); border:none; font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 14px 30px -8px rgba(0,0,0,.5); z-index:55; animation:buddyfloat 3s ease-in-out infinite;}
.chat-panel{position:fixed; right:26px; bottom:96px; width:340px; max-width:88vw; height:460px; max-height:70vh; background:var(--bg2); border:1px solid var(--border-strong); border-radius:20px; display:flex; flex-direction:column; overflow:hidden; z-index:56; box-shadow:0 24px 50px -16px rgba(0,0,0,.55);}
.chat-head{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); font-weight:700; font-size:13.5px;}
.chat-body{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;}
.chat-msg{max-width:82%; padding:9px 12px; border-radius:14px; font-size:13px; line-height:1.4;}
.chat-msg.user{align-self:flex-end; background:linear-gradient(120deg,var(--a1),var(--a2)); color:#fff; border-bottom-right-radius:4px;}
.chat-msg.buddy{align-self:flex-start; background:var(--surface-strong); border:1px solid var(--border); border-bottom-left-radius:4px;}
.chat-input-row{display:flex; gap:6px; padding:10px; border-top:1px solid var(--border);}
.chat-input-row input{flex:1;}
.chat-chips{display:flex; gap:6px; padding:8px 10px 0; overflow-x:auto;}
.chat-chips .chip{white-space:nowrap; font-size:11px; padding:5px 10px; cursor:pointer;}
.dot-badge{position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%; background:var(--danger); border:3px solid var(--bg);}
.profile-avatar{width:76px !important; height:76px !important; font-size:40px !important; border:4px solid var(--bg2); border-radius:22px !important; flex-shrink:0;}
.profile-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.profile-stats div{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px; text-align:center;}
.profile-stats b{display:block; font-family:var(--font-display); font-size:18px;}
.profile-stats span{font-size:11px; color:var(--text-dim);}
.banner-swatch{width:56px; height:34px; border-radius:10px; border:2px solid transparent; cursor:pointer;}
.banner-swatch.sel{border-color:var(--text); box-shadow:0 0 0 2px var(--a1);}
@media(max-width:880px){ .chat-panel{ bottom:80px; right:12px; } .buddy-fab{ bottom:76px; right:14px; } }

/* Mobile nav */
.mobile-tabbar{display:none;}
@media (max-width:880px){

  .mobile-tabbar button span.lbl{font-size:9px;}
  .grid-4,.grid-3{grid-template-columns:repeat(2,1fr);}
}
</style>

<script>
/* =====================================================================================
   DAYFLOW — state, persistence, and small utilities
   ===================================================================================== */
const STORE_KEY = 'dayflow_state_v1';
const uid = () => Math.random().toString(36).slice(2,10);
const todayStr = (d=new Date()) => d.toISOString().slice(0,10);
const clone = (o) => JSON.parse(JSON.stringify(o));

const CATS_DEFAULT = [
  {id:'school', name:'School', emoji:'📚', color:'#4EA8FF'},
  {id:'gaming', name:'Gaming', emoji:'🎮', color:'#8B6CFF'},

/* Endless leveling: cumulative XP needed to reach level n grows smoothly forever. */
const LEVEL_NAMES_FIXED = ['Beginner','Focus Hero','Productivity Ninja','Time Master','Legendary Human'];
const LEVEL_PREFIXES = ['Rising','Steady','Sharp','Bold','Radiant','Cosmic','Mythic','Eternal','Stellar','Prime'];
const LEVEL_SUFFIXES = ['Achiever','Doer','Planner','Champion','Icon','Sage','Virtuoso','Vanguard','Luminary','Titan'];
function xpForLevel(n){ return Math.round(80 * Math.pow(n, 1.6)); }
function nameForLevel(n){
  if(n<=LEVEL_NAMES_FIXED.length) return LEVEL_NAMES_FIXED[n-1];
  const p = LEVEL_PREFIXES[n % LEVEL_PREFIXES.length];
  const s = LEVEL_SUFFIXES[(n*7) % LEVEL_SUFFIXES.length];
  return `${p} ${s}`;
}
function buddyStageForLevel(n){
  if(n<=2) return '🥚'; if(n<=4) return '🐣'; if(n<=9) return '🦊'; if(n<=19) return '🦉'; return '🐉';
}

const BADGES = [
  {id:'early_bird', name:'Early Bird', emoji:'🌅', tier:'bronze', test:s=>s.stats.earlyCompletes>=3},

  {id:'streak3', name:'3-Day Spark', emoji:'✨', tier:'bronze', test:s=>s.streak>=3},
  {id:'streak7', name:'7-Day Streak', emoji:'🔥', tier:'bronze', test:s=>s.streak>=7},
  {id:'streak14', name:'2-Week Flame', emoji:'🔥', tier:'silver', test:s=>s.streak>=14},
  {id:'streak30', name:'30-Day Legend', emoji:'👑', tier:'gold', test:s=>s.streak>=30},
  {id:'streak100', name:'Centurion', emoji:'🏆', tier:'gold', test:s=>s.streak>=100},
  {id:'tasks10', name:'Getting Going', emoji:'✅', tier:'bronze', test:s=>s.tasks.filter(t=>t.done).length>=10},

function defaultState(){
  return {
    tasks: [], habits: [
      {id:uid(), name:'Drink Water', emoji:'💧', history:{}},
      {id:uid(), name:'Read a Book', emoji:'📖', history:{}},
      {id:uid(), name:'Exercise', emoji:'🏃', history:{}},
    ],
    notes: [], moods: {}, categories: clone(CATS_DEFAULT), events: [],
    xp: 0, xpBalance: 0, coins: 0, streak: 0, longestStreak: 0, lastActiveDate: null,
    stats: {earlyCompletes:0, lateCompletes:0, categoryCompletes:{}, dailyCompleted:{}, unlockedBadges:[], claimedQuests:{}, pomodorosDone:0, coinsEarned:0, coinsSpent:0},
    settings: {mode:'dark', theme:'cosmic', sound:true, pomodoro:{study:25,break:5}, coinRate:10, notifiedKeys:{}, weatherCoords:null, lastDailyReview:null, lastMorningGreeting:null, lastWeatherCode:null, voiceOutput:false, lastAfternoonGreeting:null, lastEveningGreeting:null, lastGoodnight:null, lastWeatherComment:null, volume:1},
    ownedItems: [], placedItems: [], ownedThemes: ['cosmic'], ownedGames: [], coinTransactions: [], lastLoginDate: null, loginStreak: 0,
    books: {owned:[], favorites:[], readLog:{}},
    profile: {name:'', avatarEmoji:'🧑', avatarPhoto:'', age:'', gender:'', goals:[], bio:'', country:'', timezone:'', school:'', favSubjects:'', favGames:'', favMusic:'', favGenres:[], banner:'cosmic', showcase:[]},
    chat: {history:[]},
    games: {reaction:{best:null}, memory:{bestMoves:null}, catch:{best:0}, g2048:{best:0}, simon:{best:0}, typing:{best:0}},
  };
}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {

function levelInfo(xp){
  let n=1; while(xpForLevel(n+1)<=xp){ n++; if(n>100000) break; }
  const curXp = xpForLevel(n), nextXp = xpForLevel(n+1);
  return {cur:{lvl:n, name:nameForLevel(n)}, next:{xp:nextXp}, pct: Math.min(100, Math.round(((xp-curXp)/(nextXp-curXp))*100))};
}
function addXP(amount){

  state.xp += amount;
  state.xpBalance = (state.xpBalance||0) + amount;

  save();
}

let audioCtx;
function ensureAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playSound(kind){
  if(!state.settings.sound) return;
  const vol = (state.settings.volume==null ? 1 : state.settings.volume);
  if(vol<=0) return;
  if(kind==='badge' || kind==='notify'){ const t = Date.now(); if(t-(playSound._last||0)<400) return; playSound._last = t; }
  try{
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    function tone(freq, start, dur, type='sine', gain=0.09){
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type=type; o.frequency.setValueAtTime(freq, now+start);
      g.gain.setValueAtTime(0, now+start);
      g.gain.linearRampToValueAtTime(gain*vol, now+start+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now+start+dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(now+start); o.stop(now+start+dur+0.02);
    }
    if(kind==='pop'){ tone(660,0,0.10,'sine',0.11); tone(880,0.06,0.12,'sine',0.08); }
    else if(kind==='levelup'){ [523,659,784,1046].forEach((f,i)=>tone(f,i*0.09,0.18,'triangle',0.09)); }
    else if(kind==='celebrate'){ [523,659,784,988,1318].forEach((f,i)=>tone(f,i*0.07,0.25,'sawtooth',0.05)); }
    else if(kind==='coin'){ tone(988,0,0.09,'square',0.05); tone(1319,0.08,0.22,'square',0.05); }
    else if(kind==='badge'){ [659,784,988,1319].forEach((f,i)=>tone(f,i*0.08,0.2,'triangle',0.09)); tone(1568,0.34,0.35,'sine',0.06); }
    else if(kind==='notify'){ tone(784,0,0.12,'sine',0.07); tone(1047,0.1,0.18,'sine',0.06); }
    else if(kind==='click'){ tone(520,0,0.04,'square',0.03); }
    else if(kind==='tick'){ tone(380,0,0.03,'sine',0.025); }
    else if(kind==='error'){ tone(200,0,0.12,'sawtooth',0.05); tone(150,0.1,0.16,'sawtooth',0.05); }
  }catch(e){ /* audio unavailable */ }
}

function fireConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  canvas.width = innerWidth; canvas.height = innerHeight;
  const colors = ['#8B6CFF','#4EA8FF','#FF9F5A','#39D98A','#FF5D77','#FFC857'];
  let parts = Array.from({length:140}, ()=>({
    x: Math.random()*canvas.width, y: -20-Math.random()*canvas.height*0.4,
    r: 4+Math.random()*5, c: colors[Math.floor(Math.random()*colors.length)],
    vy: 2+Math.random()*3, vx: -1.5+Math.random()*3, rot: Math.random()*360, vr: -6+Math.random()*12,
  }));
  let frame=0;
  function step(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    if(frame<170) requestAnimationFrame(step); else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  step();
}

function renderWeatherAnim(code){

/* Recurring tasks: roll completed/overdue recurring tasks forward to today */
function rolloverRecurringTasks(){
  const today = todayStr();
  const todayDow = new Date().getDay();
  let changed = false;
  state.tasks.forEach(t=>{
    if(!t.recurring || t.recurring==='none') return;
    if(t.done && t.completedOn && t.completedOn!==today){
      const dueDow = t.dueDate ? new Date(t.dueDate+'T00:00:00').getDay() : todayDow;
      const shouldReset = t.recurring==='daily' || (t.recurring==='weekly' && dueDow===todayDow);
      if(shouldReset){ t.done=false; t.dueDate=today; t.completedOn=null; changed=true; }
    } else if(!t.done && t.dueDate && t.dueDate<today){
      t.dueDate = today; changed=true;
    }
  });
  if(changed) save();
}

/* Drag reorder */
let dragId = null;
function attachDragHandlers(){
  document.querySelectorAll('.task[draggable=true]').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ dragId = el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); });
    el.addEventListener('dragover', e=>e.preventDefault());
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const targetId = el.dataset.id;
      if(!dragId || dragId===targetId) return;
      const from = state.tasks.findIndex(t=>t.id===dragId);
      const to = state.tasks.findIndex(t=>t.id===targetId);
      if(from<0||to<0) return;
      const [moved] = state.tasks.splice(from,1);
      state.tasks.splice(to,0,moved);
      save(); renderView();
    });
  });
}

const WEEKDAY_NAMES = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function resolveRelativeDate(phrase){
  const p = phrase.toLowerCase();
  const addDays = n => { const nd=new Date(); nd.setDate(nd.getDate()+n); return todayStr(nd); };
  if(/\btonight\b|\btoday\b|\bthis morning\b|\bthis afternoon\b/.test(p)) return {date: todayStr()};
  if(/\btomorrow\b/.test(p)) return {date: addDays(1)};
  if(/\basap\b|\burgent\b/.test(p)) return {date: todayStr(), priority:'high'};
  const d = new Date();
  for(let i=0;i<7;i++){
    const isNext = p.includes('next '+WEEKDAY_NAMES[i]);
    if(isNext || p.includes(WEEKDAY_NAMES[i])){
      let diff = (i - d.getDay() + 7)%7; diff = diff===0?7:diff;
      if(isNext) diff += 7;
      return {date: addDays(diff)};
    }
  }
  return null;
}
function resolveTimeHint(phrase){
  const p = phrase.toLowerCase();
  if(/\bmorning\b|\bbefore school\b/.test(p)) return '08:00';
  if(/\bafter lunch\b|\bafternoon\b/.test(p)) return '13:00';
  if(/\btonight\b|\bevening\b/.test(p)) return '18:00';
  if(/\bbefore bed\b/.test(p)) return '21:00';
  return '';
}
function applyRelativeHints(t, line){
  const dateInfo = resolveRelativeDate(line);
  if(dateInfo){ t.dueDate = dateInfo.date; if(dateInfo.priority) t.priority = dateInfo.priority; }
  if(!t.dueTime){ const hint = resolveTimeHint(line); if(hint) t.dueTime = hint; }
  if(/\bimportant\b|\basap\b|\burgent\b/i.test(line)) t.priority='high';
}
function localParse(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const tasks = [];
  const timeLine = /^(\d{1,2}[:.]\d{2}\s?(?:am|pm)?)\s*[-–:]?\s*(.+)$/i;
  const bulletLine = /^[-*•\d.)]+\s*(.+)$/;
  const afterPattern = /(.+?)\s+(after|before|during)\s+(.+)/i;
  lines.forEach(line=>{
    let m = line.match(timeLine);
    if(m){ const t={title:m[2].trim(), dueTime: normalizeTime(m[1]), priority:'medium'}; applyRelativeHints(t,line); tasks.push(t); return; }
    m = line.match(afterPattern);
    if(m){ const t={title:cleanupTitle(m[1]), note:`${m[2]} ${m[3]}`.trim(), priority:'medium'}; applyRelativeHints(t,line); tasks.push(t); return; }
    m = line.match(bulletLine);
    if(m){ const t={title:cleanupTitle(m[1]), priority:'medium'}; applyRelativeHints(t,line); tasks.push(t); return; }
    if(line.length>2){ const t={title:cleanupTitle(line), priority:'medium'}; applyRelativeHints(t,line); tasks.push(t); }
  });
  return tasks;
}
function cleanupTitle(s){
  s = s.replace(/^i need to\s+/i,'').replace(/^i have to\s+/i,'').trim();
  s = s.charAt(0).toUpperCase()+s.slice(1);
  return s;
}
function normalizeTime(t){
  t = t.replace('.',':').toLowerCase().trim();
  let m = t.match(/(\d{1,2}):(\d{2})\s?(am|pm)?/);
  if(!m) return '';
  let h = parseInt(m[1],10), min=m[2];
  if(m[3]==='pm' && h<12) h+=12;
  if(m[3]==='am' && h===12) h=0;
  return String(h).padStart(2,'0')+':'+min;
}
const DIFFICULTY_XP = {easy:8, medium:15, hard:25, extreme:40};
async function callClaudeForTasks(text){
  const systemPrompt = `Extract a clean to-do list from the user's notes below. Only include things that are genuinely actionable tasks — ignore small talk, questions to yourself, or commentary that isn't a to-do. If one line describes two separate things to do, split it into two tasks. Resolve natural-language timing ("tomorrow morning", "tonight", "before school", "after lunch", "before bed", "asap", "next Friday") into an actual date (today is ${todayStr()}) and a reasonable time when possible; leave dueDate/dueTime empty only if truly no timing is implied. Estimate difficulty as "easy", "medium", "hard", or "extreme" based on how much effort/time the task implies. Respond with ONLY a raw JSON array (no markdown fences, no commentary), where each item is {"title": string, "dueDate": "YYYY-MM-DD or empty", "dueTime": "HH:MM or empty", "priority": "high"|"medium"|"low", "difficulty": "easy"|"medium"|"hard"|"extreme", "note": string}. Notes:\n\n${text}`;
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model:"claude-sonnet-4-6", max_tokens:1200, messages:[{role:"user", content:systemPrompt}]})
  });
  const data = await res.json();
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const cleaned = textBlocks.replace(/```json|```/g,'').trim();
  const parsed = JSON.parse(cleaned);
  if(!Array.isArray(parsed)) throw new Error('bad shape');
  return parsed;
}
const DIFFICULTY_ICON = {easy:'🟩', medium:'🟨', hard:'🟧', extreme:'🟥'};

function eventsForDate(dateStr){
  if(!dateStr) return [];
  const [y,m,d] = dateStr.split('-');
  return (state.events||[]).filter(e=>{
    if(e.date===dateStr) return true;
    if((e.type==='birthday'||e.type==='holiday') && e.date){ const [ey,em,ed]=e.date.split('-'); return em===m && ed===d; }
    return false;
  });
}
function nextUpcomingEvent(){
  const today = todayStr();
  const now = new Date();
  const candidates = [];
  (state.events||[]).forEach(e=>{
    if(!e.date) return;
    if(e.type==='birthday'||e.type==='holiday'){
      const [,em,ed] = e.date.split('-');
      let next = new Date(now.getFullYear(), +em-1, +ed);
      if(todayStr(next) < today) next = new Date(now.getFullYear()+1, +em-1, +ed);
      candidates.push({event:e, date: todayStr(next)});
    } else if(e.date >= today){
      candidates.push({event:e, date: e.date});
    }
  });
  candidates.sort((a,b)=> a.date.localeCompare(b.date));
  return candidates[0] || null;
}

function habitStreak(h){
  let streak=0; let d = new Date();
  while(true){
    const key = todayStr(d);
    if(h.history[key]){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

function ring(value, max, color, label, valueLabel){
  const pct = max>0 ? Math.min(1, value/max) : 0;
  const r=42, c=2*Math.PI*r;
  return `
  <div class="ring-wrap">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--border)" stroke-width="9"/>
      <circle cx="50" cy="50" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 50 50)" style="transition:stroke-dashoffset .6s ease"/>
      <text x="50" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)">${valueLabel}</text>
    </svg>
    <div class="ring-label">${label}</div>
  </div>`;
}

function drawWeekChart(){
  const canvas = document.getElementById('chart-week'); if(!canvas) return;
  const ctx = canvas.getContext('2d'); if(!ctx) return; canvas.width = canvas.clientWidth; canvas.height=180;
  const vals = days.map(d=>state.stats.dailyCompleted[d.key]||0);
  const max = Math.max(1, ...vals);
  const w = canvas.width, h = canvas.height, bw = w/days.length;
  ctx.clearRect(0,0,w,h);
  const styles = getComputedStyle(document.body);
  vals.forEach((v,i)=>{
    const bh = (v/max)*(h-30);
    const grad = ctx.createLinearGradient(0,h-bh-20,0,h-20);
    grad.addColorStop(0, styles.getPropertyValue('--a1').trim()); grad.addColorStop(1, styles.getPropertyValue('--a2').trim());
    ctx.fillStyle = grad;
    const bar_w = bw*0.5;
    roundRect(ctx, i*bw+bw*0.25, h-bh-20, bar_w, bh, 6); ctx.fill();
    ctx.fillStyle = styles.getPropertyValue('--text-dim').trim(); ctx.font='11px Inter'; ctx.textAlign='center';
    ctx.fillText(days[i].label, i*bw+bw/2, h-6);
    if(v>0) ctx.fillText(v, i*bw+bw/2, h-bh-26);
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCatChart(){
  const canvas = document.getElementById('chart-cat'); if(!canvas) return;
  const ctx = canvas.getContext('2d'); if(!ctx) return; canvas.width = canvas.clientWidth; canvas.height=180;
  const max = Math.max(1, ...entries.map(e=>e.count));
  const w = canvas.width, rowH = Math.min(26, (canvas.height-10)/entries.length);
  ctx.clearRect(0,0,w,canvas.height);
  const styles = getComputedStyle(document.body);
  entries.forEach((e,i)=>{
    const y = i*rowH+6;
    ctx.fillStyle = styles.getPropertyValue('--text-dim').trim(); ctx.font='11px Inter'; ctx.textAlign='left';
    ctx.fillText(`${e.emoji} ${e.name}`, 0, y+rowH*0.55);
    const barX = 110, barMaxW = w-120;
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; roundRect(ctx, barX, y+2, barMaxW, rowH-8, 5); ctx.fill();
    ctx.fillStyle = e.color; roundRect(ctx, barX, y+2, Math.max(4,(e.count/max)*barMaxW), rowH-8, 5); ctx.fill();
    ctx.fillStyle = styles.getPropertyValue('--text').trim(); ctx.fillText(e.count, barX+barMaxW+4, y+rowH*0.55);
  });
}

function bookExcerpt(genre, idx, adj, noun, place){
  const r5=seededRand(idx*11.1+5), r6=seededRand(idx*17.3+6);
  const r7=seededRand(idx*2.71+7), r8=seededRand(idx*3.14+8), r9=seededRand(idx*6.28+9);
  const name = EXCERPT_NAMES[Math.floor(r5*EXCERPT_NAMES.length)];
  let name2 = EXCERPT_NAMES[Math.floor(r6*EXCERPT_NAMES.length)];
  if(name2===name) name2 = EXCERPT_NAMES[(EXCERPT_NAMES.indexOf(name2)+1)%EXCERPT_NAMES.length];
  const openers = GENRE_OPENERS[genre]||GENRE_OPENERS.Emotional;
  const middles = GENRE_MIDDLES[genre]||GENRE_MIDDLES.Emotional;
  const hooks = GENRE_HOOKS[genre]||GENRE_HOOKS.Emotional;
  const pick = (arr,r) => arr[Math.floor(r*arr.length)];
  const fill = s => s.split('{name2}').join(name2).split('{name}').join(name).split('{place}').join(place).split('{noun}').join(noun.toLowerCase()).split('{adj}').join(adj.toLowerCase());
  return [pick(openers,r7), pick(middles,r8), pick(hooks,r9)].map(fill).join(' ');
}
function buildBookLibrary(){
  const list = []; let idx=0;
  GENRES.forEach((genre, gi)=>{
    for(let i=0;i<50;i++){
      idx++;
      const r1=seededRand(idx*13.37), r2=seededRand(idx*7.77+1), r3=seededRand(idx*3.14+2), r4=seededRand(idx*9.81+3);
      const adj = TITLE_ADJ[Math.floor(r1*TITLE_ADJ.length)];
      const noun = TITLE_NOUN[Math.floor(r2*TITLE_NOUN.length)];
      const place = TITLE_PLACE[Math.floor(r3*TITLE_PLACE.length)];
      const templates = [`The ${adj} ${noun}`, `${noun} of ${place}`, `${adj} ${noun}s`, `Return to ${place}`, `The ${noun} We Kept`];
      const title = templates[Math.floor(r4*templates.length)];
      const pages = 120 + Math.floor(seededRand(idx*5.5)*400);
      const quality = Math.min(5, 1+Math.floor(seededRand(idx*2.2)*5));
      const price = Math.round(15 + pages/12 + quality*10 + gi*2);
      list.push({id:'bk_'+idx, title, genre, pages, quality, price, blurb: bookExcerpt(genre, idx, adj, noun, place)});
    }
  });
  return list;
}

function genreColor(genre){
  const map = {Emotional:0xFF9FB5, Fantasy:0x8B6CFF, Cinematic:0xFFC857, Motivational:0xFF9F5A, Sad:0x6C7A96, Mystery:0x4A4E6B, Adventure:0x39D98A, Romance:0xFF6FA5, 'Sci-Fi':0x4EA8FF, Cozy:0xC9A86A};
  return map[genre]||0x999999;
}
function buyBook(id){
  const b = BOOK_LIBRARY.find(x=>x.id===id); if(!b) return;
  if(state.books.owned.includes(id)) return;
  if(state.coins < b.price){ playSound('error'); toast(`Not enough coins — need 🪙 ${b.price}`); return; }
  state.coins -= b.price; logCoinTx('spend', -b.price, b.title); state.books.owned.push(id);
  checkBadges(); save();
  playSound('coin'); toast(`Added "${b.title}" to your shelf 📖`);
}
function readBook(id){
  const b = BOOK_LIBRARY.find(x=>x.id===id); if(!b) return;
  state.books.readLog[id] = Date.now();
  checkBadges(); addXP(5); save();
  openModal(`<h3>${escapeHtml(b.title)}</h3>

  return `<div class="shop-item ${owned?'owned':''}">
    <div class="ic">${item.emoji}</div>
    <div class="nm">${item.name}</div>
    <div class="pr">${owned?`Owned${owned>1?' x'+owned:''}`:'🪙 '+item.price}</div>
    ${actionHtml}
  </div>`;
}
function bookCard(b){
  const owned = state.books.owned.includes(b.id);
  const fav = state.books.favorites.includes(b.id);
  return `<div class="book-card">
    <div class="book-title">${escapeHtml(b.title)}</div>
    <div class="book-meta">${b.genre} · ${b.pages}p</div>
    <div class="stars">${'★'.repeat(b.quality)}${'☆'.repeat(5-b.quality)}</div>
    ${owned
      ? `<div style="display:flex; gap:6px;"><button class="btn small" data-read-book="${b.id}">Read</button><button class="btn small ghost" data-fav-book="${b.id}">${fav?'💛':'🤍'}</button></div>`
      : `<button class="btn small" data-buy-book="${b.id}">🪙 ${b.price}</button>`}
  </div>`;
}
function renderShopPanel(){
  if(shopTab==='books'){
    const list = (shopGenre? BOOK_LIBRARY.filter(b=>b.genre===shopGenre) : BOOK_LIBRARY).slice(0,60);
    return `
    <div class="chip-row" style="margin-bottom:12px;">
      <button class="chip ${!shopGenre?'active':''}" data-genre-pick="">All</button>
      ${GENRES.map(g=>`<button class="chip ${shopGenre===g?'active':''}" data-genre-pick="${g}">${g}</button>`).join('')}
    </div>
    <div class="shop-grid">${list.map(bookCard).join('')}</div>
    <p style="font-size:11.5px; color:var(--text-faint); margin-top:10px;">Showing ${list.length} of ${shopGenre?BOOK_LIBRARY.filter(b=>b.genre===shopGenre).length:BOOK_LIBRARY.length} books.</p>`;
  }
  return `<div class="shop-grid">${ITEM_CATALOG.map(shopItemCard).join('')}</div>`;
}
function refreshShopPanel(){
  const panel = document.getElementById('shop-panel');
  if(!panel) return;
  panel.innerHTML = renderShopPanel();
  wireShopPanelEvents();
}
function wireShopPanelEvents(){
  document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click', ()=>{ buyItem(b.dataset.buy); rebuildPlacedItems(); refreshShopPanel(); updateSidebarXP(); refreshDeskGamesSlot(); }));
  document.querySelectorAll('[data-place-deco]').forEach(b=>b.addEventListener('click', ()=>{
    const id=b.dataset.placeDeco;
    state.placedItems.deco = state.placedItems.deco||[];
    if(state.placedItems.deco.length>=8){ toast('Desk is full — remove something first'); return; }
    state.placedItems.deco.push(id); save(); rebuildPlacedItems(); refreshShopPanel();
  }));
  document.querySelectorAll('[data-remove-deco]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = state.placedItems.deco.lastIndexOf(b.dataset.removeDeco);
    if(idx>=0){ state.placedItems.deco.splice(idx,1); save(); rebuildPlacedItems(); refreshShopPanel(); }
  }));
  document.querySelectorAll('[data-place-slot]').forEach(b=>b.addEventListener('click', ()=>{
    const item = itemById(b.dataset.placeSlot);
    state.placedItems[item.slot] = item.id; save(); rebuildPlacedItems(); refreshShopPanel(); refreshDeskGamesSlot();
  }));
  document.querySelectorAll('[data-unplace-slot]').forEach(b=>b.addEventListener('click', ()=>{
    state.placedItems[b.dataset.unplaceSlot] = null; save(); rebuildPlacedItems(); refreshShopPanel(); refreshDeskGamesSlot();
  }));
  document.querySelectorAll('[data-buy-book]').forEach(b=>b.addEventListener('click', ()=>{ buyBook(b.dataset.buyBook); rebuildPlacedItems(); refreshShopPanel(); updateSidebarXP(); }));
  document.querySelectorAll('[data-read-book]').forEach(b=>b.addEventListener('click', ()=>readBook(b.dataset.readBook)));
  document.querySelectorAll('[data-fav-book]').forEach(b=>b.addEventListener('click', ()=>{ toggleFavBook(b.dataset.favBook); refreshShopPanel(); }));
  document.querySelectorAll('[data-genre-pick]').forEach(b=>b.addEventListener('click', ()=>{ shopGenre=b.dataset.genrePick; refreshShopPanel(); }));
}

function skyColorsForHour(hr){
  if(hr<5 || hr>=21) return {top:'#0b0e2e', bottom:'#1c2150', sun:false, moon:true};
  if(hr<8) return {top:'#2b2a55', bottom:'#ff9f5a', sun:true, low:true};
  if(hr<11) return {top:'#4ea8ff', bottom:'#bfe3ff', sun:true, low:false};
  if(hr<16) return {top:'#3e8bff', bottom:'#cdeeff', sun:true, low:false};
  if(hr<19) return {top:'#ff9f5a', bottom:'#7c6cff', sun:true, low:true};
  return {top:'#2b2a55', bottom:'#4a3f7a', sun:false, moon:true};
}
function buildWindowTexture(hour, code){
  const canvas = document.createElement('canvas');
  canvas.width = 260; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  if(!ctx) return new THREE.CanvasTexture(canvas);
  const sky = skyColorsForHour(hour);
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0, sky.top); grad.addColorStop(1, sky.bottom);
  ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
  const isRain = [51,61,63,65,80,95].includes(code);
  const isSnow = [71,73,75].includes(code);
  const isCloudy = [1,2,3,45,48].includes(code);
  if(sky.moon){
    ctx.fillStyle = '#f5f3e6'; ctx.beginPath(); ctx.arc(200,45,18,0,Math.PI*2); ctx.fill();
    if(!isCloudy && !isRain && !isSnow){
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for(let i=0;i<40;i++){ const x=Math.random()*canvas.width, y=Math.random()*canvas.height*0.7; const r=Math.random()*1.3;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
    }
  } else if(sky.sun){
    ctx.fillStyle = '#FFE9A8'; const sy = sky.low?150:50;
    ctx.beginPath(); ctx.arc(70, sy, 22, 0, Math.PI*2); ctx.fill();
  }
  if(isCloudy || isRain || isSnow){
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for(let i=0;i<5;i++){
      const cx = 30+i*50+Math.random()*20, cy = 40+Math.random()*40;
      ctx.beginPath(); ctx.ellipse(cx,cy,26,12,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx+18,cy+4,18,10,0,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(10,12,30,0.5)';
  ctx.fillRect(0, canvas.height-24, canvas.width, 24);
  return new THREE.CanvasTexture(canvas);
}
function buildWindow(){
  const hour = new Date().getHours();
  const code = state.settings.lastWeatherCode!=null ? state.settings.lastWeatherCode : 0;
  const tex = buildWindowTexture(hour, code);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.3,1.0), new THREE.MeshBasicMaterial({map:tex}));
  glass.position.set(0, 2.6, -1.97); deskGroup.add(glass);
  const frame = box(1.42,1.12,0.05,0x181a33,{roughness:0.7}); frame.position.set(0,2.6,-1.99); deskGroup.add(frame);
  const mullionV = box(0.03,1.0,0.02,0x181a33,{roughness:0.7}); mullionV.position.set(0,2.6,-1.965); deskGroup.add(mullionV);
  const mullionH = box(1.3,0.03,0.02,0x181a33,{roughness:0.7}); mullionH.position.set(0,2.6,-1.965); deskGroup.add(mullionH);
  const isRain = [51,61,63,65,80,95].includes(code);
  const isSnow = [71,73,75].includes(code);
  if(isRain || isSnow){
    for(let i=0;i<16;i++){
      let p;
      if(isRain){ p = box(0.008,0.05,0.005,0x9be7ff,{roughness:0.2}); p.material.transparent=true; p.material.opacity=0.7; }
      else { p = new THREE.Mesh(new THREE.CircleGeometry(0.012,6), new THREE.MeshBasicMaterial({color:0xffffff})); }
      p.position.set(-0.6+Math.random()*1.2, 2.1+Math.random()*1.0, -1.96);
      p.userData = {weatherParticle:true, isSnow, speed: isRain?(0.014+Math.random()*0.01):(0.003+Math.random()*0.003)};
      deskGroup.add(p);
    }
  }
}
function rebuildPlacedItems(){
  if(!deskGroup) return;
  [...deskGroup.children].forEach(c=>{ if(c.userData && c.userData.slotKey){ deskGroup.remove(c); } });
  if(lampLight){ deskGroup.remove(lampLight); lampLight=null; }
  Object.keys(SLOT_POS).forEach(slot=>{
    const id = state.placedItems[slot];
    if(!id) return;
    const mesh = buildItemMesh(id);
    const pos = SLOT_POS[slot];
    mesh.position.set(pos.x,pos.y,pos.z);
    mesh.userData = {slotKey:slot, itemId:id};
    mesh.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    deskGroup.add(mesh);
    if(slot==='lamp' && typeof THREE!=='undefined' && THREE.PointLight){
      lampLight = new THREE.PointLight(0xFFC857, 0.9, 4, 2);
      lampLight.position.set(pos.x+0.3, pos.y+0.6, pos.z);
      deskGroup.add(lampLight);
    }
  });
  (state.placedItems.deco||[]).forEach((id,i)=>{
    const mesh = buildItemMesh(id);
    const pos = DECO_SLOTS[i % DECO_SLOTS.length];
    mesh.position.set(pos.x,pos.y,pos.z);
    mesh.userData = {slotKey:'deco', decoIndex:i, itemId:id};
    mesh.traverse(o=>{ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
    deskGroup.add(mesh);
  });
  if(state.placedItems.bookshelf){
    const shelfPos = SLOT_POS.bookshelf;
    state.books.owned.slice(0,24).forEach((bid,i)=>{
      const book = BOOK_LIBRARY.find(b=>b.id===bid);
      const spine = box(0.03,0.22,0.16, genreColor(book?book.genre:''));
      const row = Math.floor(i/8), col = i%8;
      spine.position.set(shelfPos.x-0.4+col*0.1, shelfPos.y+0.55+row*0.55, shelfPos.z);
      spine.castShadow=true; spine.userData = {slotKey:'bookspine', idx:i};
      deskGroup.add(spine);
    });
  } else if(state.books.owned.length>0){
    state.books.owned.slice(0,10).forEach((bid,i)=>{
      const book = BOOK_LIBRARY.find(b=>b.id===bid);
      const stack = box(0.35,0.03,0.24, genreColor(book?book.genre:''));
      stack.position.set(-1.6,1.1+i*0.035,0.2);
      stack.castShadow=true; stack.receiveShadow=true; stack.userData = {slotKey:'bookspine', idx:i};
      deskGroup.add(stack);
    });
  }
}

function onDeskResize(){

  const wrap = document.getElementById('desk-canvas-wrap');
  if(!wrap) return;

function stopDeskScene(){ if(deskAnimId) cancelAnimationFrame(deskAnimId); deskAnimId=null; deskInited=false; }
function initDeskScene(){
  stopDeskScene();
  const wrap = document.getElementById('desk-canvas-wrap');
  if(!wrap) return;
  if(typeof THREE==='undefined'){
    wrap.innerHTML = '<div class="empty" style="padding-top:150px;">3D view needs internet access to load. Your items are still saved — reconnect and revisit this page.</div>';
    return;
  }
  const w = wrap.clientWidth||600, h = wrap.clientHeight||400;
  deskScene = new THREE.Scene();
  deskScene.fog = new THREE.Fog(0x0d0e1e, 9, 17);
  deskCamera = new THREE.PerspectiveCamera(45, w/h, 0.1, 100);
  deskCamera.position.set(0,5,9); deskCamera.lookAt(0,1,0);
  deskRenderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  deskRenderer.setSize(w,h); deskRenderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  if('shadowMap' in deskRenderer){ deskRenderer.shadowMap.enabled = true; deskRenderer.shadowMap.type = THREE.PCFSoftShadowMap; }
  wrap.innerHTML=''; wrap.appendChild(deskRenderer.domElement);
  const hint = document.createElement('div'); hint.className='desk-hint'; hint.textContent='🖱️ Drag to rotate · Click an item to select it';
  wrap.appendChild(hint);
  const hr = new Date().getHours();
  const tod = hr<5 ? {amb:0x2a2f55, ambI:0.35, sun:0x8fa7ff, sunI:0.35}
    : hr<11 ? {amb:0xffffff, ambI:0.6, sun:0xffffff, sunI:1.0}
    : hr<17 ? {amb:0xfff6e8, ambI:0.6, sun:0xfff3d6, sunI:0.95}
    : hr<21 ? {amb:0xffdcb0, ambI:0.5, sun:0xff9f5a, sunI:0.75}
    : {amb:0x2a2f55, ambI:0.4, sun:0x6c63ff, sunI:0.45};
  deskScene.add(new THREE.AmbientLight(tod.amb, tod.ambI));
  const dir = new THREE.DirectionalLight(tod.sun, tod.sunI); dir.position.set(4,8,6);
  dir.castShadow = true;
  if(dir.shadow){
    dir.shadow.mapSize.set(1024,1024);
    dir.shadow.camera.near=1; dir.shadow.camera.far=20;
    dir.shadow.camera.left=-6; dir.shadow.camera.right=6; dir.shadow.camera.top=6; dir.shadow.camera.bottom=-6;
    dir.shadow.bias=-0.002;
  }
  deskScene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x8888ff, 0.35); dir2.position.set(-4,4,-4); deskScene.add(dir2);
  const rim = new THREE.DirectionalLight(0x6cf0ff, 0.25); rim.position.set(0,3,-6); deskScene.add(rim);
  deskGroup = new THREE.Group(); deskScene.add(deskGroup);
  buildDeskBase(); rebuildPlacedItems();
  deskRaycaster = new THREE.Raycaster(); deskMouse = new THREE.Vector2();
  let dragging=false, lastX=0, lastY=0, moved=0;
  const dom = deskRenderer.domElement;
  dom.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; moved=0; try{dom.setPointerCapture(e.pointerId);}catch(err){} });
  dom.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; moved += Math.abs(dx)+Math.abs(dy);
    deskGroup.rotation.y += dx*0.008;
    deskGroup.rotation.x = Math.max(-0.3, Math.min(0.3, deskGroup.rotation.x + dy*0.005));
  });
  dom.addEventListener('pointerup', ()=>{ dragging=false; });
  dom.addEventListener('click', e=>{
    if(moved>6) return;
    const rect = dom.getBoundingClientRect();
    deskMouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
    deskMouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
    deskRaycaster.setFromCamera(deskMouse, deskCamera);
    const intersects = deskRaycaster.intersectObjects(deskGroup.children, true);
    const hit = intersects.find(i=>i.object.userData && (i.object.userData.slotKey || i.object.userData.isTrash));
    if(hit) selectDeskItem(hit.object.userData);
  });
  deskInited = true;
  const animate = ()=>{
    deskAnimId = requestAnimationFrame(animate);
    deskGroup.children.forEach(c=>{
      if(c.traverse) c.traverse(o=>{ if(o.userData && o.userData.spin) o.rotation.y += 0.08; });
      if(c.userData && c.userData.weatherParticle){
        c.position.y -= c.userData.speed;
        if(c.userData.isSnow) c.position.x += Math.sin(c.position.y*8)*0.0015;
        if(c.position.y < 2.1){ c.position.y = 3.1; c.position.x = -0.6+Math.random()*1.2; }
      }
    });
    deskRenderer.render(deskScene, deskCamera);
  };
  animate();
}

    area.querySelectorAll('[data-card]').forEach(btn=>btn.addEventListener('click', ()=>{
      const i = +btn.dataset.card;
      if(lock || deck[i].flipped || deck[i].matched) return;
      deck[i].flipped = true; draw();
      if(first===null){ first=i; return; }
      moves++;
      if(deck[first].e===deck[i].e){
        deck[first].matched=true; deck[i].matched=true; first=null; playSound('pop'); draw();
        if(deck.every(c=>c.matched)){
          if(!state.games.memory.bestMoves || moves<state.games.memory.bestMoves) state.games.memory.bestMoves=moves;
          addXP(15); save(); checkBadges(); toast('🧠 Memory cleared!');
        }
      } else {
        lock=true;
        setTimeout(()=>{ deck[first].flipped=false; deck[i].flipped=false; first=null; lock=false; draw(); }, 700);
      }
    }));
  }
  draw();
}
function renderCatchGame(area){
  area.innerHTML = `<canvas id="catch-canvas" width="360" height="220" style="width:100%; background:var(--surface); border-radius:14px;"></canvas>
    <p style="font-size:12px; color:var(--text-dim); margin-top:8px; text-align:center;">Move your mouse or finger to catch stars · Best: ${state.games.catch.best||0}</p>`;
  const canvas = document.getElementById('catch-canvas');
  const ctx = canvas.getContext('2d');
  if(!ctx){ area.innerHTML += '<p style="font-size:12px; color:var(--text-faint);">Canvas not supported here.</p>'; return; }
  let basketX = canvas.width/2, items=[], score=0, lastSpawn=0, start=performance.now();
  function pointerMove(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches? e.touches[0].clientX : e.clientX;
    basketX = ((clientX-rect.left)/rect.width)*canvas.width;
  }
  canvas.addEventListener('mousemove', pointerMove);
  canvas.addEventListener('touchmove', pointerMove);
  function loop(t){
    if(!document.getElementById('catch-canvas')){ stopCatchGame(); return; }
    const elapsed = (t-start)/1000;
    if(elapsed>30){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#EDEBFA'; ctx.font='16px Inter'; ctx.textAlign='center';
      ctx.fillText(`Time's up! Score: ${score}`, canvas.width/2, canvas.height/2);
      if(score>(state.games.catch.best||0)){ state.games.catch.best=score; save(); checkBadges(); }
      return;
    }
    if(t-lastSpawn>700){ lastSpawn=t; items.push({x:Math.random()*canvas.width, y:-10, v:1.5+Math.random()*1.5}); }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(basketX-24,canvas.height-14,48,10);
    items.forEach(it=>it.y+=it.v);
    items = items.filter(it=>{
      if(it.y>canvas.height-20 && Math.abs(it.x-basketX)<28){ score++; return false; }
      return it.y<canvas.height+10;
    });
    ctx.font='18px Inter'; ctx.textAlign='center';
    items.forEach(it=>ctx.fillText('⭐', it.x, it.y));
    ctx.fillStyle='#EDEBFA'; ctx.font='12px Inter'; ctx.textAlign='left'; ctx.fillText(`Score: ${score}`, 8, 16);
    catchAnimId = requestAnimationFrame(loop);
  }
  catchAnimId = requestAnimationFrame(loop);
}

function renderTicTacToe(area){
  const board = Array(9).fill(null);
  let over = false;
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(){
    for(const [a,b,c] of lines){ if(board[a] && board[a]===board[b] && board[a]===board[c]) return board[a]; }
    return board.every(Boolean) ? 'draw' : null;
  }
  function botMove(){
    const empties = board.map((v,i)=>v?null:i).filter(v=>v!==null);
    if(!empties.length) return;
    const pick = empties[Math.floor(Math.random()*empties.length)];
    board[pick] = 'O';
  }
  function draw(status){
    area.innerHTML = `
      <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:220px; margin:0 auto;">
        ${board.map((v,i)=>`<button data-cell="${i}" style="height:64px; font-size:26px; font-weight:700; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:${v==='X'?'var(--a2)':'var(--a3)'};">${v||''}</button>`).join('')}
      </div>
      <p style="font-size:12.5px; color:var(--text-dim); margin-top:10px; text-align:center;">${status}</p>
      <div style="text-align:center; margin-top:6px;"><button class="btn small ghost" id="ttt-reset">Restart</button></div>`;
    area.querySelectorAll('[data-cell]').forEach(btn=>btn.addEventListener('click', ()=>{
      const i = +btn.dataset.cell;
      if(over || board[i]) return;
      board[i] = 'X';
      let w = winner();
      if(!w){ botMove(); w = winner(); }
      if(w){
        over = true;
        const msg = w==='draw' ? "It's a draw!" : w==='X' ? 'You win! 🎉' : 'Flow wins this one!';
        if(w==='X'){ addXP(10); checkBadges(); playSound('celebrate'); }
        draw(msg);
      } else {
        draw('Your move (X)');
      }
    }));
    document.getElementById('ttt-reset').addEventListener('click', ()=>{
      for(let i=0;i<9;i++) board[i]=null;
      over=false; draw('Your move (X)');
    });
  }
  draw('Your move (X)');
}

/* 2048 */
let g2048KeyHandler=null;
function stop2048Keys(){ if(g2048KeyHandler){ document.removeEventListener('keydown', g2048KeyHandler); g2048KeyHandler=null; } }
function render2048Game(area){
  let grid = Array.from({length:4}, ()=>Array(4).fill(0));
  let score = 0;
  function addTile(){
    const empties = [];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++) if(!grid[r][c]) empties.push([r,c]);
    if(!empties.length) return;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random()<0.9 ? 2 : 4;
  }
  function slideRow(row){
    let vals = row.filter(v=>v);
    for(let i=0;i<vals.length-1;i++){
      if(vals[i]===vals[i+1]){ vals[i]*=2; score+=vals[i]; vals.splice(i+1,1); }
    }
    while(vals.length<4) vals.push(0);
    return vals;
  }
  function move(dir){
    const before = JSON.stringify(grid);
    if(dir==='left'){ grid = grid.map(row=>slideRow(row)); }
    else if(dir==='right'){ grid = grid.map(row=>slideRow([...row].reverse()).reverse()); }
    else if(dir==='up'){
      for(let c=0;c<4;c++){ const col=slideRow([grid[0][c],grid[1][c],grid[2][c],grid[3][c]]); for(let r=0;r<4;r++) grid[r][c]=col[r]; }
    } else if(dir==='down'){
      for(let c=0;c<4;c++){ const col=slideRow([grid[3][c],grid[2][c],grid[1][c],grid[0][c]]).reverse(); for(let r=0;r<4;r++) grid[r][c]=col[r]; }
    }
    if(JSON.stringify(grid)!==before){ addTile(); draw(); }
    const full = grid.every(row=>row.every(v=>v));
    if(full){
      let canMove = false;
      for(let r=0;r<4 && !canMove;r++){
        for(let c=0;c<4 && !canMove;c++){
          if(c<3 && grid[r][c]===grid[r][c+1]) canMove=true;
          if(r<3 && grid[r][c]===grid[r+1][c]) canMove=true;
        }
      }
      if(!canMove){
        if(score>(state.games.g2048.best||0)){ state.games.g2048.best=score; save(); checkBadges(); }
        addXP(Math.min(40, Math.floor(score/50)));
        const p = document.createElement('p'); p.style.textAlign='center'; p.style.fontWeight='700'; p.textContent = `Game over! Score: ${score}`;
        area.appendChild(p);
        stop2048Keys();
      }
    }
  }
  const tileColors = {2:'#3a3560',4:'#4a4270',8:'#8B6CFF',16:'#4EA8FF',32:'#39D98A',64:'#FFC857',128:'#FF9F5A',256:'#FF5D77',512:'#FF3ECB',1024:'#4EF0FF',2048:'#FFD700'};
  function draw(){
    area.innerHTML = `
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-width:260px; margin:0 auto; background:var(--surface); padding:8px; border-radius:12px;">
        ${grid.flat().map(v=>`<div style="aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-weight:700; font-size:${v>=1000?'13px':'16px'}; background:${v?tileColors[v]||'#FFD700':'rgba(255,255,255,0.06)'}; color:${v?'#fff':'transparent'};">${v||''}</div>`).join('')}
      </div>
      <p style="font-size:12.5px; color:var(--text-dim); margin-top:10px; text-align:center;">Score: ${score} · Best: ${state.games.g2048.best||0}</p>
      <p style="font-size:11px; color:var(--text-faint); text-align:center;">Use arrow keys to play</p>`;
  }
  addTile(); addTile(); draw();
  g2048KeyHandler = e=>{
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(map[e.key]){ e.preventDefault(); move(map[e.key]); }
  };
  document.addEventListener('keydown', g2048KeyHandler);
}

/* Simon Says */
function renderSimonGame(area){
  const colors = [{id:0,c:'#FF5D77'},{id:1,c:'#4EA8FF'},{id:2,c:'#FFC857'},{id:3,c:'#39D98A'}];
  let sequence = [], userStep = 0, level = 0, playing = false;
  function draw(status){
    area.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; max-width:220px; margin:0 auto;">
        ${colors.map(c=>`<button data-simon="${c.id}" style="height:80px; border-radius:14px; border:none; background:${c.c}; opacity:0.55;"></button>`).join('')}
      </div>
      <p style="font-size:12.5px; color:var(--text-dim); margin-top:10px; text-align:center;">${status}</p>
      <p style="font-size:11px; color:var(--text-faint); text-align:center;">Level: ${level} · Best: ${state.games.simon.best||0}</p>
      ${!playing?`<div style="text-align:center; margin-top:6px;"><button class="btn small" id="simon-start">Start</button></div>`:''}`;
    if(!playing) document.getElementById('simon-start').addEventListener('click', startRound);
    else area.querySelectorAll('[data-simon]').forEach(b=>b.addEventListener('click', ()=>handleClick(+b.dataset.simon)));
  }
  async function flash(id){
    const btn = area.querySelector(`[data-simon="${id}"]`);
    if(!btn) return;
    btn.style.opacity='1';
    await new Promise(r=>setTimeout(r,350));
    btn.style.opacity='0.55';
    await new Promise(r=>setTimeout(r,150));
  }
  async function playSequence(){
    playing=false; draw('Watch closely…');
    for(const id of sequence) await flash(id);
    playing=true; userStep=0; draw('Your turn');
  }
  function startRound(){
    sequence=[]; level=0; nextLevel();
  }
  function nextLevel(){
    level++; sequence.push(Math.floor(Math.random()*4));
    playSequence();
  }
  function handleClick(id){
    if(!playing) return;
    if(sequence[userStep]===id){
      userStep++;
      if(userStep>=sequence.length){
        if(level>(state.games.simon.best||0)){ state.games.simon.best=level; save(); checkBadges(); }
        addXP(5); playSound('pop');
        setTimeout(nextLevel, 500);
      }
    } else {
      playing=false;
      if(level-1>(state.games.simon.best||0)){ state.games.simon.best=level-1; save(); checkBadges(); }
      draw(`Wrong! Final level: ${level-1}`);
    }
  }
  draw('Press start');
}

  const a = document.createElement('a');
  a.href = url; a.download = `dayflow-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup downloaded 📦');

function importDataFromFile(file){
  const status = document.getElementById('backup-status');
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.tasks)) throw new Error('not a DayFlow backup');
      state = Object.assign(defaultState(), parsed, {
        stats: Object.assign({earlyCompletes:0,categoryCompletes:{},dailyCompleted:{},unlockedBadges:[],claimedQuests:{}}, parsed.stats||{}),
        settings: Object.assign({mode:'dark',theme:'cosmic',sound:true,pomodoro:{study:25,break:5}}, parsed.settings||{}),
      });
      save(); applyTheme(); renderView();
      toast('Backup restored ✅');
    }catch(e){
      if(status) status.textContent = "That file doesn't look like a DayFlow backup.";
    }
  };
  reader.readAsText(file);
}

function openFocus(){

  root.innerHTML = `

    </div>
    <div class="timer-ring">
      <svg width="260" height="260" viewBox="0 0 260 260">
        <circle cx="130" cy="130" r="115" fill="none" stroke="var(--border)" stroke-width="12"/>
        <circle id="pom-circle" cx="130" cy="130" r="115" fill="none" stroke="url(#pomgrad)" stroke-width="12" stroke-linecap="round" transform="rotate(-90 130 130)"/>
        <defs><linearGradient id="pomgrad"><stop offset="0%" stop-color="var(--a1)"/><stop offset="100%" stop-color="var(--a2)"/></linearGradient></defs>
      </svg>
      <div class="timer-time" id="pom-time">25:00</div>
    </div>
    <div style="display:flex; gap:12px;">
      <button class="btn" id="pom-toggle">▶ Start</button>
      <button class="btn ghost" id="pom-reset">Reset</button>

      ${today.length ? renderTaskList(today) : `<div class="empty">No tasks left today — nice work!</div>`}
    </div>
  </div>`;
  document.getElementById('focus-close').addEventListener('click', ()=>{ pausePomodoro(); root.innerHTML=''; });
  root.querySelectorAll('[data-pom-mode]').forEach(b=>b.addEventListener('click', ()=>setPomMode(b.dataset.pomMode)));
  document.getElementById('pom-toggle').addEventListener('click', togglePomodoro);
  document.getElementById('pom-reset').addEventListener('click', resetPomodoro);
  root.querySelectorAll('[data-action]').forEach(bindTaskAction);
  updatePomDisplay();
}
function setPomMode(mode){
  pomodoro.mode = mode;
  const mins = mode==='study'?state.settings.pomodoro.study : mode==='break'?state.settings.pomodoro.break : mode==='work'?50: 15;
  pomodoro.seconds = mins*60; pomodoro.total = mins*60;
  pausePomodoro(); openFocus();
}
function togglePomodoro(){
  if(pomodoro.running){ pausePomodoro(); }
  else{
    pomodoro.running = true;
    document.getElementById('pom-toggle').textContent = '⏸ Pause';
    pomodoro.interval = setInterval(()=>{
      pomodoro.seconds--;
      if(pomodoro.seconds<=0){
        pausePomodoro(); playSound('celebrate'); toast("⏰ Time's up!"); addXP(20); pomodoro.seconds=0;
        if(pomodoro.mode==='study'||pomodoro.mode==='work'){ state.stats.pomodorosDone=(state.stats.pomodorosDone||0)+1; checkBadges(); save(); }
      }
      updatePomDisplay();
    }, 1000);
  }
}
function pausePomodoro(){ pomodoro.running=false; clearInterval(pomodoro.interval); const b=document.getElementById('pom-toggle'); if(b) b.textContent='▶ Start'; }
function resetPomodoro(){ pausePomodoro(); pomodoro.seconds = pomodoro.total; updatePomDisplay(); }
function updatePomDisplay(){
  const el = document.getElementById('pom-time'); if(!el) return;
  const m = Math.floor(pomodoro.seconds/60), s = pomodoro.seconds%60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const pct = pomodoro.seconds/pomodoro.total;
  const r=115, c=2*Math.PI*r;
  const circle = document.getElementById('pom-circle');
  if(circle){ circle.setAttribute('stroke-dasharray', c); circle.setAttribute('stroke-dashoffset', c*(1-pct)); }
}

/* =====================================================================================
   WEEKLY RECAP — a Spotify-Wrapped-style summary of the last 7 days
   ===================================================================================== */
function openRecap(){
  const wd = weekDates();
  const completed = state.tasks.filter(t=>t.done && wd.includes(t.completedOn));
  const xpEarned = completed.reduce((s,t)=>s+({high:25,medium:15,low:8}[t.priority]||10), 0);
  const catCounts = {};
  completed.forEach(t=>{ if(t.category) catCounts[t.category]=(catCounts[t.category]||0)+1; });
  let topCatId = Object.keys(catCounts).sort((a,b)=>catCounts[b]-catCounts[a])[0];
  const topCat = topCatId ? categoryById(topCatId) : null;
  const dayCounts = {};
  wd.forEach(d=>{ dayCounts[d]=state.stats.dailyCompleted[d]||0; });
  let bestDay = Object.keys(dayCounts).sort((a,b)=>dayCounts[b]-dayCounts[a])[0];
  const bestDayLabel = bestDay ? new Date(bestDay+'T00:00:00').toLocaleDateString([], {weekday:'long'}) : '—';
  const moodTrend = wd.slice().reverse().map(d=>state.moods[d]||'⚪').join(' ');

  openModal(`
  <div class="recap-card">
    <div class="recap-title">Your week in DayFlow</div>
    <div class="recap-big">${completed.length}</div>
    <div style="color:var(--text-dim); font-size:13px;">tasks completed</div>
    <div class="recap-grid">
      <div class="recap-stat"><div class="n">+${xpEarned}</div><div class="l">XP earned</div></div>
      <div class="recap-stat"><div class="n">🔥 ${state.streak}</div><div class="l">current streak</div></div>
      <div class="recap-stat"><div class="n">${topCat?topCat.emoji+' '+topCat.name:'—'}</div><div class="l">top category</div></div>
      <div class="recap-stat"><div class="n">${bestDayLabel}</div><div class="l">most productive day</div></div>
    </div>
    <div style="margin-top:18px; font-size:12px; color:var(--text-dim);">Mood this week</div>
    <div style="font-size:20px; margin-top:4px;">${moodTrend}</div>
    <button class="btn" style="margin-top:20px;" onclick="closeModal()">Nice</button>
  </div>`);
}
